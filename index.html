const FB_PATH  = "copro/data";
const LS_KEY   = "COPRO_MASTER_V1";
const LS_BCK   = "COPRO_MASTER_V1_BCK";
const EMPTY    = { superAdmin: null, copros: [] };

// ── Firebase ────────────────────────────────────────────
let _fbRef = null, _fbReady = false;
async function initFirebase() {
  if (_fbReady) return true;
  try {
    if (!window.__fb_loaded) {
      await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js");
      window.__fb_loaded = true;
    }
    if (!window.__fb_app) window.__fb_app = firebase.initializeApp(FIREBASE_CONFIG);
    _fbRef = firebase.database().ref(FB_PATH);
    _fbReady = true;
    return true;
  } catch(e) { console.warn("Firebase init:", e.message); return false; }
}
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) { res(); return; }
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

// ── Score (meilleure version = plus de données) ─────────
function dbScore(d) {
  if (!d?.superAdmin) return 0;
  return 1 + (d.copros||[]).reduce((s,c)=>
    s+(c.users||[]).length*100+(c.appels||[]).length*10+(c.depenses||[]).length, 0);
}

// ── Sauvegarde locale ────────────────────────────────────
function saveLocal(db) {
  if (!db?.superAdmin) return;
  const j = JSON.stringify(db);
  try { localStorage.setItem(LS_KEY, j); } catch {}
  try { localStorage.setItem(LS_BCK, j); } catch {}
}

// ── Sauvegarde complète (local + Firebase) ──────────────
async function saveAll(db) {
  if (!db?.superAdmin) return;
  saveLocal(db);
  try {
    const ok = await initFirebase();
    if (ok && _fbRef) { await _fbRef.set(db); console.log("☁️ Firebase OK", new Date().toLocaleTimeString()); }
  } catch(e) { console.warn("Firebase write:", e.message); }
}

// ── Chargement (Firebase prioritaire) ───────────────────
async function loadDB() {
  let best = null, bestScore = 0;
  const tryUpdate = d => { const s = dbScore(d); if (s > bestScore) { best=d; bestScore=s; } };
  // 1. Firebase
  try {
    const ok = await initFirebase();
    if (ok && _fbRef) {
      const snap = await _fbRef.once("value");
      const d = snap.val();
      if (d?.superAdmin) { tryUpdate(d); console.log("☁️ Firebase chargé"); }
    }
  } catch(e) { console.warn("Firebase load:", e.message); }
  // 2. localStorage
  for (const k of [LS_KEY, LS_BCK]) {
    try { const r=localStorage.getItem(k); if(r) tryUpdate(JSON.parse(r)); } catch {}
  }
  if (best) { saveLocal(best); return { ...EMPTY, ...best, copros: best.copros||[] }; }
  return null;
}

// ── Sync temps réel Firebase ────────────────────────────
let _unsubFb = null;
async function startSync(onUpdate) {
  try {
    const ok = await initFirebase();
    if (!ok || !_fbRef) return;
    _unsubFb = _fbRef.on("value", snap => {
      const d = snap.val();
      if (d?.superAdmin) { saveLocal(d); onUpdate(d); }
    });
    console.log("🔄 Sync temps réel active");
  } catch(e) { console.warn("Sync:", e.message); }
}
function stopSync() { if (_fbRef && _unsubFb) { _fbRef.off("value", _unsubFb); _unsubFb = null; } }

// Export / Import JSON
function exportJSON(db) {
  const b = new Blob([JSON.stringify(db, null, 2)], {type:"application/json"});
  const a = Object.assign(document.createElement("a"), {href:URL.createObjectURL(b), download:`copro-backup-${new Date().toISOString().slice(0,10)}.json`});
  a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(file, onDone) {
  const r = new FileReader();
  r.onload = e => { try { const d=JSON.parse(e.target.result); if(d?.superAdmin) onDone(d); else alert("Fichier invalide."); } catch { alert("Erreur lecture."); } };
  r.readAsText(file);
}

// ═══════════════════════════════════════════════════════
//  UTILITAIRES
// ═══════════════════════════════════════════════════════
const uid   = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fEUR  = n => Number(n).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const fDATE = s => new Date(s).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});
const fM3   = n => Number(n).toFixed(3);
const TODAY = () => new Date().toISOString().slice(0,10);

function hash(p) { let h=5381; for(let i=0;i<p.length;i++) h=((h<<5)+h)^p.charCodeAt(i); return (h>>>0).toString(16); }

function splitEqual(total, n) {
  if (!n) return [];
  const base = Math.round(total/n*100)/100;
  const arr = Array(n).fill(base);
  arr[n-1] = Math.round((total - arr.slice(0,-1).reduce((s,v)=>s+v,0))*100)/100;
  return arr;
}

// ── Calcul eau — FONCTION UNIQUE ────────────────────────
// Prix m³ = totalBill / invoiceM3 (volume officiel de la facture)
// Conso de chaque membre = index actuel - index précédent
// Ajustement : différence entre somme des consommations relevées et volume facturé,
//              répartie également entre tous les membres
// Part finale = conso ajustée × prix m³ (dernier ajusté pour total exact)
function calcEauParts(releves, totalBill, invoiceM3) {
  const n = releves.length;
  if (!n || !totalBill || !invoiceM3) return null;
  const pm3 = Number(totalBill) / Number(invoiceM3);
  const consos = releves.map(r => Number(r.m3));
  const totalReleve = consos.reduce((s,v)=>s+v, 0);
  const diff = Number(invoiceM3) - totalReleve; // m³ non attribués
  const adj = diff / n;                          // ajustement par membre
  const consosAjustees = consos.map(c => Math.max(0, c + adj));
  const raw = consosAjustees.map(c => c * pm3);
  const rounded = raw.map(v => Math.round(v*100)/100);
  const lastAdj = Math.round((Number(totalBill) - rounded.reduce((s,v)=>s+v,0))*100)/100;
  rounded[rounded.length-1] = Math.round((rounded[rounded.length-1]+lastAdj)*100)/100;
  return releves.map((r,i) => ({
    owner: r.ownerId, ownerName: r.ownerName,
    amount: rounded[i], m3: consos[i], m3Ajuste: Math.round(consosAjustees[i]*1000)/1000,
    adjustment: Math.round(adj*1000)/1000, priceM3: pm3,
    currentIndex: r.currentIndex, lastIndex: r.lastIndex,
    paid: false, paidDate: null,
  }));
}

// ═══════════════════════════════════════════════════════
//  APP ROOT
// ═══════════════════════════════════════════════════════
function App() {
  const [db, _setDb]       = useState(null);
  const [screen, setScreen] = useState("boot");
  const [session, setSession] = useState(null);
  const [lastSaved, setLastSaved] = useState(null);
  const dbRef = useRef(null);
  const timerRef = useRef(null);

  const setDb = useCallback(d => { dbRef.current=d; _setDb(d); }, []);

  const persist = useCallback(d => {
    if (!d?.superAdmin) return;
    const stamped = { ...d, _updatedAt: Date.now() };
    dbRef.current = stamped; _setDb(stamped); setLastSaved(Date.now());
    saveAll(stamped);
  }, []);

  const persistCopro = useCallback(copro => {
    const cur = dbRef.current; if (!cur) return;
    persist({ ...cur, copros: cur.copros.map(c=>c.id===copro.id?copro:c) });
  }, [persist]);

  // Auto-correction : recalcule priceM3 pour les appels "open" mal enregistrés
  useEffect(() => {
    if (!db?.copros) return;
    let needsFix = false;
    const fixedCopros = db.copros.map(c => {
      const fixedAppels = (c.appels||[]).map(a => {
        if (a.type !== "eau" || a.status !== "open") return a;
        if (!a.totalBill || !a.invoiceM3 || Number(a.invoiceM3) <= 0) return a;
        const correctPm3 = Number(a.totalBill) / Number(a.invoiceM3);
        // Si priceM3 est absent ou manifestement faux (= invoiceM3)
        if (!a.priceM3 || Math.abs(Number(a.priceM3) - Number(a.invoiceM3)) < 0.01) {
          needsFix = true;
          return { ...a, priceM3: correctPm3 };
        }
        return a;
      });
      return { ...c, appels: fixedAppels };
    });
    if (needsFix) {
      console.log("🔧 Correction automatique priceM3 appliquée");
      persist({ ...db, copros: fixedCopros });
    }
  }, [db?.copros?.length]);

  // Chargement initial
  useEffect(() => {
    const FRESH = { ...EMPTY, superAdmin:{name:"Super Admin",login:"admin",password:hash("admin123")}, copros:[] };
    const t = setTimeout(() => { persist(FRESH); setScreen("login"); }, 8000);
    loadDB().then(d => {
      clearTimeout(t);
      const final = d || FRESH;
      if (!d) saveAll(FRESH);
      dbRef.current = final; _setDb(final); setLastSaved(Date.now()); setScreen("login");
    }).catch(() => { clearTimeout(t); persist(FRESH); setScreen("login"); });
  }, []);

  // Auto-save 30s
  useEffect(() => {
    timerRef.current = setInterval(() => { const c=dbRef.current; if(c?.superAdmin) saveAll(c); }, 30000);
    return () => clearInterval(timerRef.current);
  }, []);

  // Sync temps réel Firebase
  useEffect(() => {
    const t = setTimeout(() => {
      startSync(remote => {
        const cur = dbRef.current;
        const rTs = remote._updatedAt||0, lTs = cur?._updatedAt||0;
        if (remote?.superAdmin && (rTs>lTs || dbScore(remote)>dbScore(cur))) {
          saveLocal(remote); dbRef.current=remote; _setDb(remote); setLastSaved(Date.now());
        }
      });
    }, 2000);
    return () => { clearTimeout(t); stopSync(); };
  }, []);

  // Sauvegarde avant fermeture
  useEffect(() => {
    const h = () => { const c=dbRef.current; if(c?.superAdmin) saveLocal(c); };
    window.addEventListener("beforeunload", h);
    window.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") h(); });
    return () => window.removeEventListener("beforeunload", h);
  }, []);

  function logout() { setSession(null); setScreen("login"); }
  const handleImport = file => importJSON(file, d => { persist(d); alert("✅ Données importées !"); setScreen("login"); });

  if (screen==="boot") return <Splash />;
  if (screen==="login") return <LoginPage db={db} onSuperAdmin={()=>setScreen("super-admin")} onMember={(u,c)=>{setSession({user:u,copro:c});setScreen("app");}} onImport={handleImport}/>;
  if (screen==="super-admin") return (
    <SuperAdmin db={db} persist={persist} lastSaved={lastSaved} onLogout={logout}
      onExport={()=>exportJSON(db)} onImport={handleImport}
      onEnterCopro={c=>{setSession({user:{id:"__admin__",name:db.superAdmin.name+" (Admin)",role:"syndic",type:"proprietaire",active:true},copro:c,isAdmin:true});setScreen("app");}}/>
  );
  if (screen==="app" && session) {
    const liveCopro = db?.copros?.find(c=>c.id===session.copro?.id)||session.copro;
    return <CoproApp copro={liveCopro} user={session.user} persist={persistCopro} onLogout={logout}
      lastSaved={lastSaved} onBackAdmin={session.isAdmin?()=>setScreen("super-admin"):null} onExport={()=>exportJSON(db)}/>;
  }
  return <Splash />;
}

// ═══════════════════════════════════════════════════════
//  SPLASH
// ═══════════════════════════════════════════════════════
function Splash() {
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#07090f",flexDirection:"column",gap:16}}>
      <div style={{width:44,height:44,borderRadius:"50%",border:"3px solid #1a3a5f",borderTopColor:"#3b82f6",animation:"spin 0.8s linear infinite"}}/>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      <div style={{fontFamily:"Georgia,serif",color:"#3b82f6",fontSize:18}}>CoproManager…</div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════════════════════
function LoginPage({ db, onSuperAdmin, onMember, onImport }) {
  const [login,setLogin]=useState(""), [pass,setPass]=useState(""), [err,setErr]=useState(""), [busy,setBusy]=useState(false);
  const fileRef=useRef();
  function attempt() {
    if (!login.trim()||!pass) return;
    setErr(""); setBusy(true);
    setTimeout(() => {
      setBusy(false);
      const h=hash(pass);
      if (db?.superAdmin && login.trim().toLowerCase()===db.superAdmin.login && h===db.superAdmin.password) { onSuperAdmin(); return; }
      for (const c of (db?.copros||[])) {
        const u=(c.users||[]).find(u=>u.login===login.trim().toLowerCase()&&u.password===h&&u.active);
        if (u) { onMember(u,c); return; }
      }
      setErr("Identifiant ou mot de passe incorrect."); setPass("");
    }, 350);
  }
  return (
    <div style={{minHeight:"100vh",background:"#07090f",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:380}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{width:68,height:68,borderRadius:20,background:"linear-gradient(135deg,#1d4ed8,#3b82f6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:34,margin:"0 auto 16px",boxShadow:"0 8px 32px #1d4ed855"}}>🏢</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:24,fontWeight:700,color:"#f0f9ff"}}>CoproManager</div>
          <div style={{fontFamily:"system-ui",fontSize:13,color:"#475569",marginTop:4}}>Gestion de copropriété</div>
        </div>
        <div style={S.card}>
          <FL label="Identifiant"><FI value={login} onChange={setLogin} placeholder="email ou téléphone" onKey={e=>e.key==="Enter"&&attempt()} autoFocus/></FL>
          <FL label="Mot de passe"><FI type="password" value={pass} onChange={setPass} placeholder="••••••••" onKey={e=>e.key==="Enter"&&attempt()}/></FL>
          {err&&<Err>{err}</Err>}
          <Btn onClick={attempt} disabled={!login.trim()||!pass||busy} full>{busy?"Vérification…":"Se connecter →"}</Btn>
          <div style={{marginTop:18,paddingTop:16,borderTop:"1px solid #1a3a5f33",textAlign:"center"}}>
            <button onClick={()=>fileRef.current.click()} style={{background:"none",border:"1px solid #1a3a5f",color:"#64748b",padding:"7px 16px",borderRadius:9,cursor:"pointer",fontFamily:"system-ui",fontSize:12}}>
              📂 Restaurer une sauvegarde
            </button>
            <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>e.target.files[0]&&onImport(e.target.files[0])}/>
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  SUPER ADMIN
// ═══════════════════════════════════════════════════════
function SuperAdmin({ db, persist, lastSaved, onLogout, onExport, onImport, onEnterCopro }) {
  const [tab,setTab]=useState("copros"), [selCopro,setSelCopro]=useState(null);
  const liveCopro = selCopro ? db.copros.find(c=>c.id===selCopro.id)||selCopro : null;
  const fileRef=useRef();
  return (
    <div style={S.root}>
      <header style={S.header}>
        <div><div style={S.eyebrow}>Super Administrateur</div><div style={S.title}>CoproManager</div></div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <SaveBadge lastSaved={lastSaved}/>
          <button onClick={onExport} style={{padding:"6px 14px",borderRadius:8,border:"1px solid #166834",background:"#14532d22",color:"#4ade80",fontFamily:"system-ui",fontSize:12,fontWeight:700,cursor:"pointer"}}>💾 Export</button>
          <button onClick={()=>fileRef.current.click()} style={{padding:"6px 14px",borderRadius:8,border:"1px solid #1a3a5f",background:"transparent",color:"#64748b",fontFamily:"system-ui",fontSize:12,cursor:"pointer"}}>📂 Restaurer</button>
          <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>e.target.files[0]&&onImport(e.target.files[0])}/>
          <SmBtn onClick={onLogout} danger>Déconnexion</SmBtn>
        </div>
      </header>
      <DataStatusBar lastSaved={lastSaved} db={db} onExport={onExport}/>
      <div style={S.tabBar}>
        {[{id:"copros",l:"🏢 Copropriétés"},{id:"compte",l:"⚙️ Mon compte"}].map(t=>(
          <button key={t.id} onClick={()=>{setTab(t.id);setSelCopro(null);}} style={{...S.tabBtn,...(tab===t.id&&!selCopro?S.tabAct:{})}}>{t.l}</button>
        ))}
        {liveCopro&&<button onClick={()=>setTab("users")} style={{...S.tabBtn,...(tab==="users"?S.tabAct:{}),marginLeft:8,borderLeft:"1px solid #1a3a5f",paddingLeft:16}}>👥 {liveCopro.name}</button>}
      </div>
      <main style={S.main}>
        {tab==="copros"&&<CoprosTab db={db} persist={persist} onManageUsers={c=>{setSelCopro(c);setTab("users");}} onEnterCopro={onEnterCopro}/>}
        {tab==="users"&&liveCopro&&<UsersTab copro={liveCopro} db={db} persist={persist} onBack={()=>{setTab("copros");setSelCopro(null);}}/>}
        {tab==="compte"&&<AccountTab db={db} persist={persist}/>}
      </main>
    </div>
  );
}

// ─── Copropriétés ─────────────────────────────────────────

  const [showForm,setShowForm]=useState(false), [edit,setEdit]=useState(null);
  const [form,setForm]=useState({name:"",address:"",iban:""});
  function openCreate() { setEdit(null); setForm({name:"",address:"",iban:""}); setShowForm(true); }
  function openEdit(c) { setEdit(c); setForm({name:c.name,address:c.address||"",iban:c.iban||""}); setShowForm(true); }
  async function saveCopro() {
    if (!form.name.trim()) return;
    const copros = edit ? db.copros.map(c=>c.id===edit.id?{...c,...form}:c)
      : [...db.copros,{id:uid(),...form,refPriceM3:"",assuranceAnnuelle:"",adminPin:"",users:[],appels:[],depenses:[]}];
    await persist({...db,copros}); setShowForm(false);
  }
  async function delCopro(id) {
    if (!confirm("Supprimer cette copropriété et toutes ses données ?")) return;
    await persist({...db,copros:db.copros.filter(c=>c.id!==id)});
  }
  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:22}}>
        <KPI icon="🏢" label="Copropriétés" val={db.copros.length} color="#60a5fa"/>
        <KPI icon="👥" label="Utilisateurs" val={db.copros.reduce((s,c)=>s+(c.users||[]).length,0)} color="#4ade80"/>
        <KPI icon="📢" label="Appels" val={db.copros.reduce((s,c)=>s+(c.appels||[]).length,0)} color="#f59e0b"/>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <h2 style={S.h2}>Copropriétés</h2>
        <Btn small onClick={openCreate}>+ Nouvelle</Btn>
      </div>
      {showForm&&(
        <div style={{...S.card,border:"1px solid #2563eb55",marginBottom:20}}>
          <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:700,color:"#60a5fa",marginBottom:16}}>{edit?"✏️ Modifier":"🏢 Nouvelle copropriété"}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <FL label="Nom *"><FI value={form.name} onChange={v=>setForm(p=>({...p,name:v}))} placeholder="Résidence Les Mimosas"/></FL>
            <FL label="Adresse"><FI value={form.address} onChange={v=>setForm(p=>({...p,address:v}))} placeholder="12 rue de la Paix, 13001"/></FL>
          </div>
          <FL label="IBAN (affiché aux membres pour leurs virements)">
            <textarea value={form.iban} onChange={e=>setForm(p=>({...p,iban:e.target.value}))} placeholder={"FR76 XXXX XXXX XXXX XXXX XXXX XXX\nTitulaire : …"} style={{...S.inp,height:68,resize:"vertical"}}/>
          </FL>
          <div style={{display:"flex",gap:10}}>
            <SecBtn onClick={()=>setShowForm(false)}>Annuler</SecBtn>
            <Btn disabled={!form.name.trim()} onClick={saveCopro}>{edit?"Enregistrer":"Créer"}</Btn>
          </div>
        </div>
      )}
      {db.copros.length===0&&!showForm&&<Empty>Aucune copropriété. Créez-en une pour commencer.</Empty>}
      {db.copros.map(c=>{
        const bal=(c.appels||[]).flatMap(a=>(a.payments||[]).filter(p=>p.paid)).reduce((s,p)=>s+Number(p.amount),0)-(c.depenses||[]).reduce((s,d)=>s+Number(d.amount),0);
        const membersNoIndex=(c.users||[]).filter(u=>u.active&&u.id!=="__admin__"&&!u.lastIndex);
        return (
          <div key={c.id} style={{...S.card,marginBottom:14,border:"1px solid #1a3a5f"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
              <div style={{display:"flex",gap:14,alignItems:"center",flex:1}}>
                <div style={{width:50,height:50,borderRadius:14,background:"linear-gradient(135deg,#1d4ed8,#2563eb)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>🏢</div>
                <div>

function UsersTab({ copro, db, persist, onBack }) {
  const [showForm,setShowForm]=useState(false), [edit,setEdit]=useState(null), [err,setErr]=useState(""), [search,setSearch]=useState("");
  const [form,setForm]=useState({name:"",login:"",password:"",role:"membre",type:"proprietaire",active:true,lastIndex:""});
  function openCreate() { setEdit(null); setForm({name:"",login:"",password:"",role:"membre",type:"proprietaire",active:true,lastIndex:""}); setShowForm(true); setErr(""); }
  function openEdit(u) { setEdit(u); setForm({...u,password:"",lastIndex:u.lastIndex||""}); setShowForm(true); setErr(""); }
  async function saveUser() {
    setErr("");
    if (!form.name.trim()) { setErr("Nom requis."); return; }
    if (!form.login.trim()) { setErr("Identifiant requis."); return; }
    const loginLc=form.login.trim().toLowerCase();
    if (loginLc===db.superAdmin.login) { setErr("Identifiant réservé."); return; }
    const allLogins=db.copros.flatMap(c=>(c.users||[]).map(u=>({login:u.login,id:u.id})));
    if (allLogins.find(x=>x.login===loginLc&&x.id!==edit?.id)) { setErr("Identifiant déjà utilisé."); return; }
    let user;
    if (edit) {
      user={...edit,name:form.name.trim(),login:loginLc,role:form.role,type:form.type,active:form.active};
      if (form.password) user.password=hash(form.password);
      if (form.lastIndex!=="") user.lastIndex=Number(form.lastIndex);
    } else {
      if (!form.password||form.password.length<4) { setErr("Mot de passe min. 4 caractères."); return; }
      user={id:uid(),name:form.name.trim(),login:loginLc,password:hash(form.password),role:form.role,type:form.type,active:true};
      if (form.lastIndex!=="") user.lastIndex=Number(form.lastIndex);
    }
    const users=edit?copro.users.map(u=>u.id===edit.id?user:u):[...(copro.users||[]),user];
    await persist({...db,copros:db.copros.map(c=>c.id===copro.id?{...copro,users}:c)});
    setShowForm(false);
  }
  async function toggleActive(u) {
    const users=(copro.users||[]).map(x=>x.id===u.id?{...x,active:!x.active}:x);
    await persist({...db,copros:db.copros.map(c=>c.id===copro.id?{...copro,users}:c)});
  }
  async function delUser(u) {
    if (!confirm(`Supprimer ${u.name} ?`)) return;
    const users=(copro.users||[]).filter(x=>x.id!==u.id);
    await persist({...db,copros:db.copros.map(c=>c.id===copro.id?{...copro,users}:c)});
  }
  const filtered=(copro.users||[]).filter(u=>u.name.toLowerCase().includes(search.toLowerCase())||u.login.toLowerCase().includes(search.toLowerCase()));
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:22}}>
        <button onClick={onBack} style={{padding:"7px 14px",borderRadius:9,border:"1px solid #1a3a5f",background:"transparent",color:"#64748b",fontFamily:"system-ui",fontSize:13,cursor:"pointer"}}>← Retour</button>
        <div><h2 style={{...S.h2,marginBottom:2}}>👥 Membres</h2><div style={{fontFamily:"system-ui",fontSize:12,color:"#475569"}}>🏢 {copro.name}</div></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:18}}>
        <KPI icon="👤" label="Total" val={(copro.users||[]).length} color="#60a5fa"/>
        <KPI icon="✅" label="Actifs" val={(copro.users||[]).filter(u=>u.active).length} color="#4ade80"/>
        <KPI icon="🏠" label="Propriétaires" val={(copro.users||[]).filter(u=>u.type==="proprietaire").length} color="#f59e0b"/>
        <KPI icon="🔢" label="Index définis" val={(copro.users||[]).filter(u=>u.lastIndex).length} color="#a78bfa"/>
      </div>
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        <div style={{position:"relative",flex:1}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher…" style={{...S.inp,paddingLeft:36}}/>
          <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"#475569"}}>🔍</span>
        </div>
        <Btn small onClick={openCreate}>+ Ajouter</Btn>
      </div>
      {showForm&&(
        <div style={{...S.card,border:"1px solid #2563eb55",marginBottom:18}}>
          <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:700,color:"#60a5fa",marginBottom:16}}>{edit?`✏️ ${edit.name}`:"➕ Nouvel utilisateur"}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <FL label="Nom complet *"><FI value={form.name} onChange={v=>setForm(p=>({...p,name:v}))} placeholder="Prénom Nom"/></FL>
            <FL label="Identifiant *"><FI value={form.login} onChange={v=>setForm(p=>({...p,login:v}))} placeholder="email ou 06XXXXXXXX"/></FL>
            <FL label={edit?"Nouveau mot de passe":"Mot de passe *"}><FI type="password" value={form.password} onChange={v=>setForm(p=>({...p,password:v}))} placeholder={edit?"(inchangé)":"Min. 4 caractères"}/></FL>
            <FL label="Rôle">
              <select value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))} style={S.inp}>
                <option value="syndic">Syndic</option>
                <option value="membre">Membre</option>
              </select>
            </FL>
            <FL label="Type">
              <select value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))} style={S.inp}>
                <option value="proprietaire">🏠 Propriétaire</option>
                <option value="locataire">🔑 Locataire</option>
              </select>
            </FL>
            {edit&&<FL label="Statut">
              <select value={form.active?"1":"0"} onChange={e=>setForm(p=>({...p,active:e.target.value==="1"}))} style={S.inp}>
                <option value="1">✅ Actif</option>
                <option value="0">🚫 Inactif</option>
              </select>
            </FL>}
          </div>
          <div style={{background:"#07090f",borderRadius:10,padding:"14px",border:"1px solid #f59e0b44",marginTop:4,marginBottom:8}}>
            <div style={{fontFamily:"system-ui",fontSize:12,fontWeight:700,color:"#f59e0b",marginBottom:10}}>🔒 Index compteur (admin uniquement)</div>
            <FL label="Index actuel du compteur (m³)">
              <div style={{position:"relative"}}>
                <input type="number" min="0" step="0.001" value={form.lastIndex??""} onChange={e=>setForm(p=>({...p,lastIndex:e.target.value}))} placeholder="ex: 1535.250" style={{...S.inp,paddingRight:42}}/>
                <span style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",color:"#38bdf8",fontFamily:"system-ui",fontSize:12,fontWeight:700}}>m³</span>
              </div>
            </FL>
            {edit?.lastIndex&&<div style={{fontFamily:"system-ui",fontSize:12,color:"#38bdf8",marginTop:4}}>Index actuel : <strong>{Number(edit.lastIndex).toFixed(3)} m³</strong></div>}
            <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569",marginTop:6,lineHeight:1.5}}>⚠️ Seul l'administrateur peut modifier cet index. Il sert de base pour le calcul de consommation.</div>
          </div>
          {err&&<Err>{err}</Err>}
          <div style={{display:"flex",gap:10,marginTop:6}}>
            <SecBtn onClick={()=>setShowForm(false)}>Annuler</SecBtn>
            <Btn onClick={saveUser}>{edit?"Enregistrer":"Créer"}</Btn>
          </div>
        </div>
      )}
      {filtered.length===0&&!showForm&&<Empty>Aucun utilisateur. Cliquez sur <strong>+ Ajouter</strong>.</Empty>}
      {filtered.length>0&&(
        <div style={{border:"1px solid #1a3a5f33",borderRadius:12,overflow:"hidden"}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1fr 1fr 1fr",background:"#060c16",padding:"10px 16px",borderBottom:"1px solid #1a3a5f22"}}>
            {["Nom","Login","Rôle","Index","Actions"].map(h=><div key={h} style={{fontFamily:"system-ui",fontSize:11,fontWeight:700,color:"#334155",letterSpacing:1,textTransform:"uppercase"}}>{h}</div>)}
          </div>
          {filtered.map((u,i)=>(
            <div key={u.id} style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1fr 1fr 1fr",padding:"12px 16px",borderBottom:i<filtered.length-1?"1px solid #1a3a5f11":"none",background:i%2===0?"#0c1829":"#090f1d",alignItems:"center"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <Av name={u.name} idx={i} size={32}/>
                <div>
                  <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:600,color:"#e2e8f0"}}>{u.name}</div>
                  <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569"}}>{u.type==="proprietaire"?"🏠":"🔑"} {u.active?"Actif":"Inactif"}</div>
                </div>
              </div>
              <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b"}}>{u.login}</div>
              <div><Tag color={u.role==="syndic"?"#60a5fa":"#a3e635"}>{u.role}</Tag></div>
              <div style={{fontFamily:"system-ui",fontSize:12,color:u.lastIndex?"#38bdf8":"#f59e0b"}}>
                {u.lastIndex?fM3(u.lastIndex)+" m³":"⚠️ Non défini"}
              </div>
              <div style={{display:"flex",gap:4}}>
                <IBtn onClick={()=>openEdit(u)}>✏️</IBtn>
                <IBtn onClick={()=>toggleActive(u)}>{u.active?"🚫":"✅"}</IBtn>

        </div>
      )}
    </div>
  );
}

// ─── Compte admin ───────────────────────────────────────
function AccountTab({ db, persist }) {
  const [name,setName]=useState(db.superAdmin.name), [login,setLogin]=useState(db.superAdmin.login);
  const [pass,setPass]=useState(""), [conf,setConf]=useState(""), [err,setErr]=useState(""), [ok,setOk]=useState(false);
  async function save() {
    setErr("");
    if (!login.trim()) { setErr("Identifiant requis."); return; }
    if (pass&&pass.length<4) { setErr("Mot de passe trop court."); return; }
    if (pass&&pass!==conf) { setErr("Mots de passe différents."); return; }
    const sa={...db.superAdmin,name:name.trim(),login:login.trim().toLowerCase()};
    if (pass) sa.password=hash(pass);
    await persist({...db,superAdmin:sa});
    setOk(true); setPass(""); setConf(""); setTimeout(()=>setOk(false),2000);
  }
  return (
    <div style={{maxWidth:480}}>
      <h2 style={S.h2}>Mon compte</h2>
      <div style={S.card}>
        <FL label="Nom"><FI value={name} onChange={setName}/></FL>
        <FL label="Identifiant"><FI value={login} onChange={setLogin}/></FL>
        <FL label="Nouveau mot de passe"><FI type="password" value={pass} onChange={setPass} placeholder="(inchangé)"/></FL>
        <FL label="Confirmer"><FI type="password" value={conf} onChange={setConf}/></FL>
        {err&&<Err>{err}</Err>}
        <Btn onClick={save}>{ok?"✓ Sauvegardé !":"Enregistrer"}</Btn>
      </div>
    </div>
  );
}

//  COPRO APP (syndic + membres)

function CoproApp({ copro, user, persist, onLogout, lastSaved, onBackAdmin, onExport }) {
  const [tab,setTab]=useState("dashboard");
  const isSyndic=user.role==="syndic";
  const members=(copro.users||[]).filter(u=>u.active&&u.id!=="__admin__");
  const balance=(()=>{
    const IN=(copro.appels||[]).flatMap(a=>(a.payments||[]).filter(p=>p.paid)).reduce((s,p)=>s+Number(p.amount),0);
    const OUT=(copro.depenses||[]).reduce((s,d)=>s+Number(d.amount),0);
    return IN-OUT;
  })();
  async function update(patch) { await persist({...copro,...patch}); }
  const TABS=[
    {id:"dashboard",label:"🏠 Accueil",   show:true},
    {id:"appels",   label:"📢 Appels",     show:isSyndic},
    {id:"compteurs",label:"🔢 Compteurs",  show:isSyndic},
    {id:"caisse",   label:"🏦 Caisse",     show:isSyndic},
    {id:"depenses", label:"💸 Dépenses",   show:isSyndic},
    {id:"params",   label:"⚙️ Paramètres", show:isSyndic},
  ].filter(t=>t.show);
  return (
    <div style={S.root}>
      <header style={S.header}>
        <div><div style={S.eyebrow}>{copro.name}</div><div style={S.title}>{user.name}</div></div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          {onBackAdmin&&<button onClick={onBackAdmin} style={{padding:"6px 14px",borderRadius:8,border:"1px solid #f59e0b55",background:"#f59e0b18",color:"#f59e0b",fontFamily:"system-ui",fontSize:12,fontWeight:700,cursor:"pointer"}}>← Admin</button>}
          <SaveBadge lastSaved={lastSaved}/>
          {isSyndic&&<button onClick={onExport} style={{padding:"6px 14px",borderRadius:8,border:"1px solid #166834",background:"#14532d22",color:"#4ade80",fontFamily:"system-ui",fontSize:12,fontWeight:700,cursor:"pointer"}}>💾 Export</button>}
          <Tag color={isSyndic?"#60a5fa":"#a3e635"}>{isSyndic?"Syndic":"Membre"}</Tag>
          {isSyndic&&<span style={{fontFamily:"system-ui",fontSize:12,color:"#4ade80",fontWeight:700}}>{fEUR(balance)}</span>}
          {!onBackAdmin&&<SmBtn onClick={onLogout} danger>Déconnexion</SmBtn>}
        </div>
      </header>
      <div style={S.tabBar}>
        {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tabBtn,...(tab===t.id?S.tabAct:{})}}>{t.label}</button>)}
      </div>
      <main style={S.main}>
        {tab==="dashboard"&&<Dashboard copro={copro} user={user} isSyndic={isSyndic} balance={balance} members={members} update={update}/>}
        {tab==="appels"&&isSyndic&&<AppelsTab copro={copro} members={members} update={update}/>}
        {tab==="compteurs"&&isSyndic&&<CompteursTab copro={copro} update={update}/>}
        {tab==="caisse"&&isSyndic&&<CaisseTab copro={copro} balance={balance} update={update}/>}
        {tab==="depenses"&&isSyndic&&<DepensesTab copro={copro} update={update}/>}
        {tab==="params"&&isSyndic&&<ParamsTab copro={copro} update={update}/>}
      </main>
    </div>
  );
}

    .flatMap(a=>(a.payments||[]).filter(p=>p.owner===user.id&&!p.paid&&Number(p.amount)>0)
    .map(p=>({...p,appelTitle:a.title,appelDate:a.date,appelType:a.type,totalBill:a.totalBill,priceM3:a.priceM3,totalConso:a.totalConso})));

                <div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>

                {p.appelType==="eau"&&p.m3>0&&(

                      onSignal={async()=>{
                        const appels=(copro.appels||[]).map(a=>{

      })()}

      {/* 🚨 ALERTE index manquants */}

        return (

// ─── Saisie index inline (dashboard membre) ────────────────
function InlineReleveForm({ appels, user, copro, update }) {
  const [vals,setVals]=useState({});
  const getLastIndex = () => (copro.users||[]).find(u=>u.id===user.id)?.lastIndex||null;

  async function submit(appelId, currentIndex) {
    const idx=Number(currentIndex);
    if (!idx||idx<=0) return;
    const lastIdx=getLastIndex();
    const conso=lastIdx?Math.max(0,idx-lastIdx):idx;
    const newAppels=(copro.appels||[]).map(a=>{
      if (a.id!==appelId) return a;
      const releves=[...(a.releves||[]).filter(r=>r.ownerId!==user.id),
        {ownerId:user.id,ownerName:user.name,currentIndex:idx,lastIndex:lastIdx,m3:conso,enteredAt:new Date().toISOString()}];
      return {...a,releves};
    });
    // Ne pas mettre à jour lastIndex ici — sera fait lors de la validation du calcul
    await update({appels:newAppels});
    setVals(p=>({...p,[appelId]:""}));
  }

  return (
    <Sec title="💧 Facture eau — Saisissez votre index">
      {appels.map(a=>{
        const r=(a.releves||[]).find(rv=>rv.ownerId===user.id);
        const lastIdx=getLastIndex();
        const cur=vals[a.id]||"";
        const previewConso=cur&&lastIdx?Math.max(0,Number(cur)-lastIdx):cur?Number(cur):null;
        // Prix m³ : totalBill ÷ invoiceM3 TOUJOURS (jamais refPriceM3 pour l'eau)
        const _bill = Number(a.totalBill) || 0;
        const _vol  = Number(a.invoiceM3) || 0;
        const pm3   = _bill > 0 && _vol > 0 ? _bill / _vol : null;
        const previewEur=previewConso!=null&&pm3?previewConso*pm3:null;
        return (
          <div key={a.id} style={{...S.card,border:`1px solid ${r?"#166834":"#f59e0b55"}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
              <div>
                <div style={{fontFamily:"system-ui",fontSize:15,fontWeight:700,color:"#f0f9ff"}}>💧 {a.title}</div>
                <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b",marginTop:3}}>
                  {fDATE(a.date)}
                  {a.totalBill&&<span style={{color:"#f59e0b",marginLeft:8}}>Facture : {fEUR(a.totalBill)}</span>}
                  {a.invoiceM3&&<span style={{color:"#38bdf8",marginLeft:8}}>{Number(a.invoiceM3).toFixed(3)} m³ → {(Number(a.totalBill)/Number(a.invoiceM3)).toFixed(5)} €/m³</span>}
                </div>
              </div>
              <span style={{fontFamily:"system-ui",fontSize:11,padding:"3px 10px",borderRadius:20,background:r?"#14532d":"#f59e0b22",color:r?"#4ade80":"#f59e0b"}}>
                {r?"✓ Saisi":"⏳ À saisir"}
              </span>
            </div>
            {r?(
              <div style={{background:"#14532d22",borderRadius:10,padding:"14px",border:"1px solid #166834"}}>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:12}}>
                  {[["Index préc.", r.lastIndex?fM3(r.lastIndex):"—","#64748b"],["Index actuel",fM3(r.currentIndex),"#38bdf8"],["Consommation",fM3(r.m3)+" m³","#4ade80"]].map(([l,v,c])=>(
                    <div key={l} style={{textAlign:"center"}}>
                      <div style={{fontFamily:"system-ui",fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>{l}</div>
                      <div style={{fontFamily:"system-ui",fontSize:16,fontWeight:700,color:c}}>{v}</div>
                    </div>
                  ))}
                </div>
                {pm3&&<div style={{background:"#060c16",borderRadius:8,padding:"10px",fontFamily:"system-ui",fontSize:13,textAlign:"center",marginBottom:12}}>
                  {fM3(r.m3)} m³ × {pm3 ? pm3.toFixed(5) : (_bill>0&&_vol>0?(_bill/_vol).toFixed(5):"?")} €/m³ = <strong style={{color:"#f59e0b"}}>{pm3 ? fEUR(r.m3*pm3) : "—"}</strong>
                  <div style={{color:"#475569",fontSize:11,marginTop:2}}>Estimation — montant exact calculé quand tous ont saisi</div>
                </div>}

                {/* Bouton virement anticipé — dès que l'index est saisi */}
                {pm3 && r.m3 > 0 && (() => {
                  const estAmount = Math.round(r.m3 * pm3 * 100) / 100;
                  // Créer un objet payment factice pour SepaVirement
                  const fakePmt = { amount: estAmount, owner: user.id };
                  // Vérifier si déjà signalé
                  const alreadySignaled = (a.payments||[]).find(px=>px.owner===user.id&&px.signaled);
                  return alreadySignaled ? (
                    <div style={{background:"#1d4ed822",borderRadius:9,padding:"12px",border:"1px solid #2563eb44",textAlign:"center",marginBottom:12}}>
                      <div style={{fontFamily:"system-ui",fontSize:14,fontWeight:700,color:"#60a5fa",marginBottom:4}}>✓ Virement signalé au syndic</div>
                      <div style={{fontFamily:"system-ui",fontSize:12,color:"#475569"}}>En attente de confirmation — vous serez marqué "payé" dès réception.</div>
                    </div>
                  ) : (
                    <div style={{marginBottom:12}}>
                      <SepaVirement copro={copro} payment={fakePmt} user={user} appelTitle={a.title}
                        onSignal={async()=>{
                          const appels=(copro.appels||[]).map(ax=>{
                            if(ax.id!==a.id) return ax;
                            // Mettre à jour ou créer le payment pour ce membre
                            const payments=(ax.payments||[]).map(px=>
                              px.owner===user.id?{...px,signaled:true,signaledAt:new Date().toISOString()}:px
                            );
                            return {...ax,payments};
                          });
                          await update({appels});
                        }}/>
                    </div>
                  );
                })()}

                <div style={{textAlign:"right"}}>
                  <button onClick={()=>update({appels:(copro.appels||[]).map(x=>x.id!==a.id?x:{...x,releves:(x.releves||[]).filter(rv=>rv.ownerId!==user.id)})})}
                    style={{background:"none",border:"1px solid #1a3a5f",color:"#64748b",padding:"5px 14px",borderRadius:8,cursor:"pointer",fontFamily:"system-ui",fontSize:12}}>
                    ✏️ Modifier mon relevé
                  </button>
                </div>
              </div>
            ):(
              <div>
                {lastIdx&&<div style={{background:"#0a1628",borderRadius:8,padding:"10px 12px",marginBottom:12,fontFamily:"system-ui",fontSize:12,display:"flex",justifyContent:"space-between"}}>
                  <span style={{color:"#64748b"}}>Votre dernier index enregistré :</span>
                  <strong style={{color:"#38bdf8"}}>{fM3(lastIdx)} m³</strong>
                </div>}
                <FL label="Votre index actuel (relevé sur votre compteur)">
                  <div style={{display:"flex",gap:10}}>
                    <div style={{position:"relative",flex:1}}>
                      <input type="number" min="0" step="0.001" value={cur}
                        onChange={e=>setVals(p=>({...p,[a.id]:e.target.value}))}
                        onKeyDown={e=>e.key==="Enter"&&submit(a.id,cur)}
                        placeholder={lastIdx?`> ${fM3(lastIdx)}`:"ex: 1547.250"}
                        autoFocus style={{...S.inp,paddingRight:42,fontSize:16,fontWeight:600}}/>
                      <span style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",color:"#38bdf8",fontFamily:"system-ui",fontSize:13,fontWeight:700}}>m³</span>
                    </div>
                    <button onClick={()=>submit(a.id,cur)}
                      disabled={!cur||Number(cur)<=0||(lastIdx&&Number(cur)<lastIdx)}
                      style={{padding:"0 22px",borderRadius:10,border:"none",background:(!cur||Number(cur)<=0)?"#1e3a5f":"linear-gradient(135deg,#059669,#10b981)",color:(!cur||Number(cur)<=0)?"#475569":"#fff",fontFamily:"system-ui",fontSize:14,fontWeight:700,cursor:(!cur||Number(cur)<=0)?"not-allowed":"pointer",whiteSpace:"nowrap"}}>
                      ✓ Valider
                    </button>
                  </div>
                </FL>
                {previewConso!=null&&previewConso>=0&&(
                  <div style={{background:"#0a1628",borderRadius:10,padding:"12px",border:"1px solid #1a3a5f44",marginTop:4}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontFamily:"system-ui",fontSize:13,marginBottom:lastIdx?6:0}}>
                      <span style={{color:"#64748b"}}>Consommation calculée :</span>
                      <strong style={{color:"#38bdf8"}}>{fM3(previewConso)} m³</strong>
                    </div>
                    {lastIdx&&<div style={{fontFamily:"system-ui",fontSize:11,color:"#475569",marginBottom:previewEur?8:0}}>{Number(cur).toFixed(3)} − {fM3(lastIdx)} = {fM3(previewConso)} m³</div>}
                    {previewEur!=null&&<div style={{display:"flex",justifyContent:"space-between",fontFamily:"system-ui",fontSize:14,fontWeight:700}}>
                      <span style={{color:"#64748b"}}>Votre part estimée :</span>
                      <span style={{color:"#f59e0b"}}>{fEUR(previewEur)}</span>
                    </div>}
                  </div>
                )}
                {lastIdx&&cur&&Number(cur)<lastIdx&&Number(cur)>0&&(
                  <div style={{fontFamily:"system-ui",fontSize:12,color:"#f87171",marginTop:6}}>⚠️ L'index actuel ne peut pas être inférieur à l'index précédent ({fM3(lastIdx)} m³)</div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </Sec>
  );
}

// ─── Appels de fonds ──────────────────────────────────────
function AppelsTab({ copro, members, update }) {
  const [show,setShow]=useState(false), [type,setType]=useState("eau"), [title,setTitle]=useState(""), [date,setDate]=useState(TODAY()), [note,setNote]=useState("");
  const [bill,setBill]=useState(""), [invM3,setInvM3]=useState(""), [mAmts,setMAmts]=useState({});
  const [editAppel,setEditAppel]=useState(null); // appel en cours de modification

  function handleBill(v) {
    setBill(v);
    if (copro.refPriceM3&&Number(copro.refPriceM3)>0&&v&&Number(v)>0)
      setInvM3((Number(v)/Number(copro.refPriceM3)).toFixed(3));
  }

  // Membres sans index défini
  const membersNoIndex=members.filter(m=>!m.lastIndex);

  const canCreate=type==="eau"?(title.trim()&&bill&&Number(bill)>0&&invM3&&Number(invM3)>0)
    :type==="assurance"?(title.trim()&&copro.assuranceAnnuelle&&Number(copro.assuranceAnnuelle)>0)
    :(title.trim()&&members.length>0&&members.every(m=>mAmts[m.id]&&!isNaN(Number(mAmts[m.id]))));

  async function create() {
    let ap={id:uid(),title:title.trim(),date,note,type,status:"active",createdAt:new Date().toISOString()};
    if (type==="eau") {
      ap={...ap,totalBill:Number(bill),invoiceM3:Number(invM3),
        status:"open",releves:[],
        payments:members.map(m=>({owner:m.id,ownerName:m.name,amount:0,m3:0,paid:false,paidDate:null}))};
    } else if (type==="assurance") {
      const total=Number(copro.assuranceAnnuelle);
      const shares=splitEqual(total,members.length);
      ap={...ap,totalBill:total,payments:members.map((m,i)=>({owner:m.id,ownerName:m.name,amount:shares[i],paid:false,paidDate:null}))};
    } else {
      const pmts=members.map(m=>({owner:m.id,ownerName:m.name,amount:Number(mAmts[m.id]||0),paid:false,paidDate:null}));
      ap={...ap,totalBill:pmts.reduce((s,p)=>s+p.amount,0),payments:pmts};
    }
    let newAppels;
    if (editAppel) {
      // Mode modification : on met à jour l'appel existant sans toucher aux relevés
      newAppels = (copro.appels||[]).map(a => a.id!==editAppel.id ? a : {
        ...a,
        title: ap.title, date: ap.date, note: ap.note,
        totalBill: ap.totalBill, invoiceM3: ap.invoiceM3,
      });
    } else {
      newAppels = [ap,...(copro.appels||[])];
    }
    await update({appels: newAppels});
    setTitle(""); setBill(""); setInvM3(""); setNote(""); setMAmts({}); setShow(false); setEditAppel(null);
  }

  // Validation : utilise calcEauParts — FONCTION UNIQUE
  async function validateReleves(id) {
    const appel=(copro.appels||[]).find(a=>a.id===id);
    if (!appel||!appel.invoiceM3) return;
    const payments=calcEauParts(appel.releves, appel.totalBill, appel.invoiceM3);
    if (!payments) return;
    const tc=appel.releves.reduce((s,r)=>s+Number(r.m3),0);
    const pm3=appel.totalBill/appel.invoiceM3;
    const newAppels=(copro.appels||[]).map(a=>a.id!==id?a:{...a,payments,totalConso:tc,priceM3:pm3,status:"active"});
    // Mettre à jour lastIndex de chaque membre
    const newUsers=(copro.users||[]).map(u=>{
      const r=appel.releves.find(rv=>rv.ownerId===u.id);
      if (!r?.currentIndex) return u;
      return {...u,lastIndex:r.currentIndex,indexHistory:[...(u.indexHistory||[]),{index:r.currentIndex,previousIndex:r.lastIndex,m3:r.m3,date:new Date().toISOString()}]};
    });
    await update({appels:newAppels,users:newUsers});
  }

  // Auto-validation protégée contre les boucles
  const validatingRef=useRef(new Set());
  useEffect(()=>{
    (copro.appels||[]).filter(a=>a.type==="eau"&&a.status==="open").forEach(a=>{
      const allIn=members.length>0&&(a.releves||[]).length>=members.length;
      if (allIn&&!validatingRef.current.has(a.id)) {
        validatingRef.current.add(a.id);
        validateReleves(a.id).finally(()=>validatingRef.current.delete(a.id));
      }
    });
  },[copro.appels]);

  async function togglePaid(appelId,ownerId) {
    const appels=(copro.appels||[]).map(a=>{
      if (a.id!==appelId) return a;
      const payments=(a.payments||[]).map(p=>p.owner!==ownerId?p:{...p,paid:!p.paid,paidDate:!p.paid?new Date().toISOString():null});
      return {...a,payments,status:payments.every(p=>p.paid)?"complete":"active"};
    });
    await update({appels});
  }
  async function delAppel(id) { if (!confirm("Supprimer cet appel ?")) return; await update({appels:(copro.appels||[]).filter(a=>a.id!==id)}); }

  const sorted=[...(copro.appels||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h2 style={S.h2}>Appels de fonds</h2>
        <Btn small onClick={()=>{setShow(!show);setEditAppel(null);}}>{show?"✕ Annuler":"+ Nouvel appel"}</Btn>
      </div>
      {members.length===0&&show&&<div style={{...S.card,border:"1px solid #f59e0b44",marginBottom:14}}><div style={{fontFamily:"system-ui",fontSize:13,color:"#fde68a"}}>⚠️ Aucun membre actif. Ajoutez d'abord des utilisateurs.</div></div>}
      {show&&(
        <div style={S.card}>
          {editAppel ? (
            <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:700,color:"#60a5fa",marginBottom:18}}>
              ✏️ Modifier la facture — {editAppel.title}
            </div>
          ) : (
            <div style={{display:"flex",gap:8,marginBottom:18}}>
              {[{id:"eau",l:"💧 Eau"},{id:"assurance",l:"🛡️ Assurance"},{id:"autre",l:"📁 Autre"}].map(t=>(
                <button key={t.id} onClick={()=>setType(t.id)} style={{flex:1,padding:"9px 4px",borderRadius:10,border:`2px solid ${type===t.id?"#2563eb":"#1a3a5f"}`,background:type===t.id?"#1d4ed822":"transparent",color:type===t.id?"#7dd3fc":"#64748b",fontFamily:"system-ui",fontWeight:700,fontSize:13,cursor:"pointer"}}>{t.l}</button>
              ))}
            </div>
          )}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <FL label="Titre *"><FI value={title} onChange={setTitle} placeholder={type==="eau"?"Eau T2 2025":type==="assurance"?"Assurance 2025":"Libellé"}/></FL>
            <FL label="Date"><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={S.inp}/></FL>
          </div>
          {type==="eau"&&(
            <>
              {membersNoIndex.length>0&&<div style={{background:"#450a0a22",borderRadius:10,padding:"10px 14px",border:"1px solid #7f1d1d44",marginBottom:14,fontFamily:"system-ui",fontSize:12}}>
                <span style={{color:"#f87171"}}>⚠️ Ces membres n'ont pas d'index défini : </span>
                <strong style={{color:"#fca5a5"}}>{membersNoIndex.map(m=>m.name).join(", ")}</strong>
                <div style={{color:"#64748b",marginTop:4}}>→ Allez dans 🔢 Compteurs pour définir leur index de départ.</div>
              </div>}
              <FL label="💶 Montant total TTC de la facture (€)">
                <NIn value={bill} onChange={handleBill} placeholder="0.00" unit="€"/>
              </FL>
              <FL label="💧 Volume total consommé (m³ — indiqué sur la facture)">
                <NIn value={invM3} onChange={setInvM3} placeholder="ex: 195.000" unit="m³"/>
                {invM3&&bill&&Number(invM3)>0&&Number(bill)>0&&(
                  <div style={{fontFamily:"system-ui",fontSize:13,color:"#a78bfa",marginTop:6,fontWeight:600}}>
                    Prix du m³ : {(Number(bill)/Number(invM3)).toFixed(5)} €
                  </div>
                )}
              </FL>
            </>
          )}
          {type==="assurance"&&(
            copro.assuranceAnnuelle&&Number(copro.assuranceAnnuelle)>0
              ?<div style={{background:"#0f0f2a",borderRadius:10,padding:"12px",border:"1px solid #818cf844",marginBottom:14}}>
                <div style={{fontFamily:"system-ui",fontSize:12,color:"#818cf8",fontWeight:700,marginBottom:8}}>Parts égales — {fEUR(Number(copro.assuranceAnnuelle))} total</div>
                {members.map((m,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontFamily:"system-ui",fontSize:13,color:"#94a3b8",marginBottom:4}}><span>{m.name}</span><span style={{color:"#4ade80",fontWeight:700}}>{fEUR(splitEqual(Number(copro.assuranceAnnuelle),members.length)[i])}</span></div>)}
              </div>
              :<Err>Renseignez la cotisation annuelle dans ⚙️ Paramètres.</Err>
          )}
          {type==="autre"&&members.map((m,i)=><FL key={i} label={m.name}><NIn value={mAmts[m.id]||""} onChange={v=>setMAmts(p=>({...p,[m.id]:v}))} placeholder="0.00" unit="€"/></FL>)}
          <FL label="Note (optionnel)"><FI value={note} onChange={setNote} placeholder="Référence facture…"/></FL>
          <Btn disabled={!canCreate||members.length===0} onClick={create} full>Créer l'appel de fonds</Btn>
        </div>
      )}
      {sorted.length===0&&!show&&<Empty>Aucun appel de fonds.</Empty>}
      {sorted.map(a=>{
        const tDu=(a.payments||[]).reduce((s,p)=>s+Number(p.amount),0);
        const tPay=(a.payments||[]).filter(p=>p.paid).reduce((s,p)=>s+Number(p.amount),0);
        const allIn=(a.releves?.length||0)>=members.length&&members.length>0;
        const bc=a.status==="complete"?"#4ade80":a.status==="open"?"#f59e0b":"#3b82f6";
        return (
          <div key={a.id} style={{...S.card,marginBottom:14,borderLeft:`4px solid ${bc}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div>
                <div style={{fontFamily:"system-ui",fontSize:14,fontWeight:700,color:"#f0f9ff"}}>{a.type==="eau"?"💧":a.type==="assurance"?"🛡️":"📁"} {a.title}</div>
                <div style={{fontFamily:"system-ui",fontSize:11,color:"#64748b",marginTop:2,display:"flex",gap:10,flexWrap:"wrap"}}>
                  <span>{fDATE(a.date)}</span>
                  {a.invoiceM3&&<span style={{color:"#38bdf8"}}>{Number(a.invoiceM3).toFixed(3)} m³</span>}
                  {a.priceM3&&<span style={{color:"#a78bfa"}}>{Number(a.priceM3).toFixed(5)} €/m³</span>}
                  {a.note&&<span>· {a.note}</span>}
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:700,color:a.status==="complete"?"#4ade80":"#60a5fa"}}>
                  {a.status==="open"?"⏳ Relevés en cours":`${fEUR(tPay)} / ${fEUR(tDu)}`}
                </div>
                <SBadge status={a.status}/>
              </div>
            </div>
            {a.type==="eau"&&a.status==="open"&&(
              <div style={{background:"#060c16",borderRadius:10,padding:"12px",marginBottom:10,border:"1px solid #f59e0b33"}}>
                <div style={{fontFamily:"system-ui",fontSize:12,fontWeight:700,color:"#f59e0b",marginBottom:8}}>Relevés reçus ({(a.releves||[]).length}/{members.length})</div>
                {members.map((m,i)=>{
                  const r=(a.releves||[]).find(rv=>rv.ownerId===m.id);
                  return <div key={i} style={{display:"flex",justifyContent:"space-between",fontFamily:"system-ui",fontSize:13,color:"#94a3b8",marginBottom:4}}>
                    <span>{m.name}</span>
                    {r?<span style={{color:"#4ade80"}}>✓ Index {fM3(r.currentIndex)} m³ (conso: {fM3(r.m3)} m³)</span>
                      :<span style={{color:"#f59e0b"}}>En attente…</span>}
                  </div>;
                })}
                {allIn&&<div style={{background:"#14532d22",borderRadius:8,padding:"8px",marginTop:8,fontFamily:"system-ui",fontSize:12,color:"#4ade80",textAlign:"center"}}>✅ Tous les relevés reçus — calcul en cours…</div>}
              </div>
            )}
            {a.status!=="open"&&tDu>0&&(
              <div style={{height:5,background:"#1a3a5f",borderRadius:3,marginBottom:12,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${Math.min(100,(tPay/tDu)*100)}%`,background:"linear-gradient(90deg,#3b82f6,#4ade80)",borderRadius:3,transition:"width 0.4s"}}/>
              </div>
            )}
            {a.status!=="open"&&(a.payments||[]).map((p,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px",borderRadius:9,background:p.paid?"#14532d22":"#1a3a5f22",marginBottom:6,border:`1px solid ${p.paid?"#166834":"#1a3a5f"}`}}>
                <div style={{display:"flex",gap:10,alignItems:"center"}}>
                  <button onClick={()=>togglePaid(a.id,p.owner)} style={{width:26,height:26,borderRadius:7,border:`2px solid ${p.paid?"#4ade80":"#3b82f6"}`,background:p.paid?"#4ade80":"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"#0a1628",flexShrink:0}}>{p.paid?"✓":""}</button>
                  <div>
                    <div style={{fontFamily:"system-ui",fontSize:13,color:p.paid?"#86efac":"#e2e8f0",fontWeight:600}}>{p.ownerName}</div>
                    {a.type==="eau"&&p.m3>0&&<div style={{fontFamily:"system-ui",fontSize:11,color:"#38bdf8"}}>
                      {fM3(p.lastIndex||0)} → {fM3(p.currentIndex||0)} m³ | conso: {fM3(p.m3)} m³
                      {p.adjustment&&p.adjustment!==0&&<span style={{color:"#64748b"}}> (ajust. {p.adjustment>0?"+":""}{fM3(p.adjustment)})</span>}
                    </div>}
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"system-ui",fontSize:15,fontWeight:700,color:p.paid?"#4ade80":"#f59e0b"}}>{fEUR(p.amount)}</div>
                  {p.paid&&p.paidDate&&<div style={{fontFamily:"system-ui",fontSize:10,color:"#64748b"}}>{fDATE(p.paidDate)}</div>}
                </div>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}>
              {a.status==="open"&&(
                <button onClick={()=>{
                  setEditAppel(a);
                  setTitle(a.title); setBill(String(a.totalBill||"")); setInvM3(String(a.invoiceM3||""));
                  setDate(a.date); setNote(a.note||""); setShow(true);
                }} style={{background:"none",border:"1px solid #1a3a5f",color:"#60a5fa",padding:"5px 14px",borderRadius:8,cursor:"pointer",fontSize:12,fontFamily:"system-ui"}}>
                  ✏️ Modifier la facture
                </button>
              )}
              <button onClick={()=>delAppel(a.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:12,fontFamily:"system-ui",marginLeft:"auto"}}>🗑 Supprimer</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── Compteurs (syndic) ────────────────────────────────────
function CompteursTab({ copro, update }) {
  const members=(copro.users||[]).filter(u=>u.active&&u.id!=="__admin__");
  const [indexes,setIndexes]=useState(Object.fromEntries(members.map(m=>[m.id,m.lastIndex||""])));
  const [pwd,setPwd]=useState(""), [verified,setVerified]=useState(false), [err,setErr]=useState(""), [saved,setSaved]=useState(false);
  const adminPwd=copro.adminPin||"";
  function verify() {
    if (!adminPwd) { if(pwd.length>=4){setVerified(true);setErr("");}else setErr("Min. 4 caractères."); return; }
    if (pwd===adminPwd) { setVerified(true); setErr(""); }
    else setErr("Code incorrect.");
  }
  async function saveIndexes() {
    const users=(copro.users||[]).map(u=>{
      const newIdx=indexes[u.id];
      if (newIdx!==undefined&&newIdx!=="") return {...u,lastIndex:Number(newIdx),indexHistory:[...(u.indexHistory||[]),{index:Number(newIdx),date:new Date().toISOString(),setBy:"syndic"}]};
      return u;
    });
    await update({users}); setSaved(true); setTimeout(()=>setSaved(false),2500);
  }
  return (
    <div>
      <h2 style={S.h2}>🔢 Index des compteurs</h2>
      <div style={{fontFamily:"system-ui",fontSize:13,color:"#64748b",marginBottom:20,lineHeight:1.7}}>
        Définissez ou mettez à jour l'index de chaque propriétaire.<br/>
        Cet index sert de base pour calculer la consommation lors du prochain relevé.
      </div>
      {!verified?(
        <div style={{...S.card,border:"1px solid #f59e0b44",maxWidth:440}}>
          <div style={{fontFamily:"system-ui",fontSize:14,fontWeight:700,color:"#f59e0b",marginBottom:6}}>🔒 Accès protégé</div>
          <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b",marginBottom:16,lineHeight:1.6}}>
            {adminPwd?"Entrez votre code admin (défini dans ⚙️ Paramètres) pour continuer.":"Entrez un code à 4 caractères minimum pour déverrouiller."}
          </div>
          <FL label="Code admin"><FI type="password" value={pwd} onChange={setPwd} placeholder="Votre code" onKey={e=>e.key==="Enter"&&verify()}/></FL>
          {err&&<Err>{err}</Err>}
          <Btn onClick={verify} full>🔓 Accéder aux compteurs</Btn>
        </div>
      ):(
        <>
          <div style={{background:"#14532d22",borderRadius:10,padding:"10px 14px",border:"1px solid #166834",marginBottom:20,fontFamily:"system-ui",fontSize:12,color:"#4ade80",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span>✓ Accès autorisé — modification des index activée</span>
            <button onClick={()=>{setVerified(false);setPwd("");}} style={{background:"none",border:"1px solid #166834",color:"#4ade80",padding:"4px 10px",borderRadius:6,cursor:"pointer",fontFamily:"system-ui",fontSize:11}}>🔒 Verrouiller</button>
          </div>
          {members.length===0?<Empty>Aucun membre.</Empty>:(
            <>
              <div style={{border:"1px solid #1a3a5f33",borderRadius:12,overflow:"hidden",marginBottom:16}}>
                <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1.5fr",background:"#060c16",padding:"10px 16px",borderBottom:"1px solid #1a3a5f22"}}>
                  {["Propriétaire","Index enregistré","Nouvel index (m³)"].map(h=><div key={h} style={{fontFamily:"system-ui",fontSize:11,fontWeight:700,color:"#334155",letterSpacing:1,textTransform:"uppercase"}}>{h}</div>)}
                </div>
                {members.map((m,i)=>(
                  <div key={m.id} style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1.5fr",padding:"14px 16px",borderBottom:i<members.length-1?"1px solid #1a3a5f11":"none",background:i%2===0?"#0c1829":"#090f1d",alignItems:"center",gap:10}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <Av name={m.name} idx={i} size={34}/>
                      <div>
                        <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:600,color:"#e2e8f0"}}>{m.name}</div>
                        <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569"}}>{m.type==="proprietaire"?"🏠":"🔑"}</div>
                      </div>
                    </div>
                    <div style={{textAlign:"center"}}>
                      {m.lastIndex?<span style={{fontFamily:"system-ui",fontSize:15,fontWeight:700,color:"#38bdf8"}}>{Number(m.lastIndex).toFixed(3)} m³</span>
                        :<span style={{fontFamily:"system-ui",fontSize:12,color:"#f59e0b"}}>⚠️ Non défini</span>}
                      {(m.indexHistory||[]).length>0&&<div style={{fontFamily:"system-ui",fontSize:10,color:"#475569",marginTop:2}}>{(m.indexHistory||[]).length} modification{(m.indexHistory||[]).length>1?"s":""}</div>}
                    </div>
                    <div style={{position:"relative"}}>
                      <input type="number" min="0" step="0.001" value={indexes[m.id]||""}
                        onChange={e=>setIndexes(p=>({...p,[m.id]:e.target.value}))}
                        placeholder={m.lastIndex?Number(m.lastIndex).toFixed(3):"ex: 1535.250"}
                        style={{...S.inp,paddingRight:42,fontSize:14,fontWeight:600,borderColor:indexes[m.id]&&Number(indexes[m.id])>0?"#2563eb":"#1a3a5f"}}/>
                      <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:"#38bdf8",fontFamily:"system-ui",fontSize:11,fontWeight:700}}>m³</span>
                    </div>
                  </div>
                ))}
              </div>
              {members.some(m=>indexes[m.id]&&indexes[m.id]!=="")&&(
                <div style={{...S.card,border:"1px solid #2563eb44",marginBottom:16}}>
                  <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:700,color:"#60a5fa",marginBottom:10}}>📋 Récapitulatif</div>
                  {members.filter(m=>indexes[m.id]&&indexes[m.id]!=="").map((m,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontFamily:"system-ui",fontSize:13,marginBottom:6}}>
                      <span style={{color:"#e2e8f0",fontWeight:600}}>{m.name}</span>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        {m.lastIndex&&<><span style={{color:"#64748b"}}>{Number(m.lastIndex).toFixed(3)}</span><span style={{color:"#475569"}}>→</span></>}
                        <span style={{color:"#4ade80",fontWeight:700}}>{Number(indexes[m.id]).toFixed(3)} m³</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              <Btn onClick={saveIndexes} full style={{background:"linear-gradient(135deg,#059669,#10b981)"}}>{saved?"✅ Enregistrés !":"💾 Enregistrer les index"}</Btn>
            </>
          )}
        </>
      )}
    </div>
  );
}

// ─── Caisse ────────────────────────────────────────────────
function CaisseTab({ copro, balance, update }) {
  const tIN=(copro.appels||[]).flatMap(a=>(a.payments||[]).filter(p=>p.paid)).reduce((s,p)=>s+Number(p.amount),0);
  const tOUT=(copro.depenses||[]).reduce((s,d)=>s+Number(d.amount),0);
  const pending=(copro.appels||[]).flatMap(a=>a.status!=="open"?(a.payments||[]).filter(p=>!p.paid&&Number(p.amount)>0).map(p=>({...p,appelTitle:a.title,appelId:a.id})):[]);
  const events=[
    ...(copro.appels||[]).flatMap(a=>(a.payments||[]).filter(p=>p.paid).map(p=>({date:p.paidDate,type:"in",label:`${p.ownerName} — ${a.title}`,amount:p.amount}))),
    ...(copro.depenses||[]).map(d=>({date:d.date,type:"out",label:d.label,amount:d.amount})),
  ].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20);
  async function confirm_(appelId,ownerId) {
    const appels=(copro.appels||[]).map(a=>{
      if (a.id!==appelId) return a;
      const payments=(a.payments||[]).map(p=>p.owner!==ownerId?p:{...p,paid:true,paidDate:new Date().toISOString()});
      return {...a,payments,status:payments.every(p=>p.paid)?"complete":"active"};
    });
    await update({appels});
  }
  return (
    <div>
      <h2 style={S.h2}>Caisse commune</h2>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:22}}>
        <KPI icon="📥" label="Entrées" val={fEUR(tIN)} color="#4ade80"/>
        <KPI icon="📤" label="Sorties" val={fEUR(tOUT)} color="#f87171"/>
        <KPI icon="💰" label="Solde" val={fEUR(balance)} color={balance>=0?"#4ade80":"#f87171"}/>
      </div>
      {pending.length>0&&(
        <Sec title={`⏳ Virements à confirmer (${pending.length})`}>
          {pending.map((p,i)=>(
            <div key={i} style={{...S.card,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,border:"1px solid #f59e0b33"}}>
              <div>
                <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:600,color:"#fde68a"}}>{p.ownerName}</div>
                <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b"}}>{p.appelTitle}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontFamily:"system-ui",fontWeight:700,color:"#f59e0b"}}>{fEUR(p.amount)}</span>
                <button onClick={()=>confirm_(p.appelId,p.owner)} style={{padding:"6px 14px",borderRadius:9,border:"none",background:"linear-gradient(135deg,#059669,#10b981)",color:"#fff",fontFamily:"system-ui",fontSize:13,fontWeight:700,cursor:"pointer"}}>✓ Reçu</button>
              </div>
            </div>
          ))}
        </Sec>
      )}
      <Sec title="📜 Historique">
        {!events.length?<Empty>Aucun mouvement.</Empty>:events.map((e,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",background:S.card.background,borderRadius:10,marginBottom:6,borderLeft:`3px solid ${e.type==="in"?"#4ade80":"#f87171"}`}}>
            <div>
              <div style={{fontFamily:"system-ui",fontSize:13,color:"#e2e8f0"}}>{e.label}</div>
              <div style={{fontFamily:"system-ui",fontSize:11,color:"#64748b"}}>{fDATE(e.date)}</div>
            </div>
            <span style={{fontFamily:"system-ui",fontWeight:700,color:e.type==="in"?"#4ade80":"#f87171"}}>{e.type==="in"?"+":"-"}{fEUR(e.amount)}</span>
          </div>
        ))}
      </Sec>
    </div>
  );
}

// ─── Virement SEPA avec QR Code ────────────────────────────
function SepaVirement({ copro, payment, user, appelTitle, onSignal }) {
  const [showQR, setShowQR] = useState(false);
  const [qrLoaded, setQrLoaded] = useState(false);
  const qrRef = useRef(null);

  // Extraire l'IBAN propre (1ère ligne, sans espaces)
  const rawIban = (copro.iban||"").split("\n")[0].replace(/\s/g,"").toUpperCase();
  // Extraire le nom du titulaire (2ème ligne si dispo)
  const ibanLines = (copro.iban||"").split("\n");
  const benefName = ibanLines[1] ? ibanLines[1].replace(/^Titulaire\s*:\s*/i,"").trim() : "Copropriete";
  const amount = Number(payment.amount).toFixed(2);
  const ref = `${appelTitle} ${user.name}`.slice(0,35); // max 35 chars SEPA

  // Format QR SEPA (EPC069-12 standard)
  const sepaQrData = [
    "BCD",        // Service Tag
    "002",        // Version
    "1",          // Encoding UTF-8
    "SCT",        // SEPA Credit Transfer
    "",           // BIC (optionnel)
    benefName.slice(0,70),  // Nom bénéficiaire
    rawIban,      // IBAN
    `EUR${amount}`, // Montant
    "",           // Purpose (vide)
    "",           // Reference structurée (vide)
    ref,          // Reference non structurée
    "CoproManager" // Display text
  ].join("\n");

  useEffect(() => {
    if (!showQR) return;
    // Charger QRCode.js depuis CDN si pas encore chargé
    if (window.QRCode) { setQrLoaded(true); return; }
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    s.onload = () => setQrLoaded(true);
    document.head.appendChild(s);
  }, [showQR]);

  useEffect(() => {
    if (!qrLoaded || !showQR || !qrRef.current) return;
    qrRef.current.innerHTML = "";
    try {
      new window.QRCode(qrRef.current, {
        text: sepaQrData,
        width: 220, height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: window.QRCode.CorrectLevel.M,
      });
    } catch(e) { console.warn("QR error:", e); }
  }, [qrLoaded, showQR, sepaQrData]);

  return (
    <div style={{display:"flex",flexDirection:"column",gap:8}}>

      {/* Bouton QR Code SEPA */}
      <button onClick={()=>setShowQR(!showQR)}
        style={{width:"100%",padding:"13px",borderRadius:10,border:"none",
          background:showQR?"#1d4ed8":"linear-gradient(135deg,#059669,#10b981)",
          color:"#fff",fontFamily:"system-ui",fontSize:15,fontWeight:700,cursor:"pointer"}}>
        {showQR ? "✕ Fermer le QR code" : "📱 Scanner pour virer — " + fEUR(payment.amount)}
      </button>

      {/* QR Code SEPA */}
      {showQR && (
        <div style={{background:"#fff",borderRadius:14,padding:"20px",textAlign:"center"}}>
          <div style={{fontFamily:"system-ui",fontSize:12,color:"#334155",marginBottom:12,fontWeight:600}}>
            📱 Ouvrez votre appli bancaire → Virement → Scanner QR
          </div>
          <div ref={qrRef} style={{display:"inline-block",borderRadius:8,overflow:"hidden"}}/>
          {!qrLoaded && <div style={{color:"#64748b",fontSize:12,padding:"40px 0"}}>Chargement du QR code…</div>}
          <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569",marginTop:12,lineHeight:1.6}}>
            Compatible : BNP, Crédit Agricole, Société Générale,<br/>
            Boursorama, Revolut, N26, et toutes les banques SEPA
          </div>
          {/* Détails en texte pour vérification */}
          <div style={{background:"#f8fafc",borderRadius:8,padding:"10px",marginTop:12,textAlign:"left"}}>
            <div style={{fontFamily:"monospace",fontSize:11,color:"#334155",lineHeight:1.8}}>
              <div>IBAN : <strong>{rawIban.replace(/(.{4})/g,"$1 ").trim()}</strong></div>
              <div>Montant : <strong>{fEUR(payment.amount)}</strong></div>
              <div>Référence : <strong>{ref}</strong></div>
            </div>
          </div>
        </div>
      )}

      {/* Copier tous les détails */}
      <CopyBtn
        text={`IBAN : ${rawIban}\nMontant : ${fEUR(payment.amount)}\nRéférence : ${ref}`}
        label="Copier les coordonnées bancaires"
      />

      {/* Notifier le syndic */}
      <button onClick={onSignal}
        style={{width:"100%",padding:"10px",borderRadius:9,border:"1px solid #2563eb44",
          background:"#0a1e38",color:"#60a5fa",fontFamily:"system-ui",fontSize:13,fontWeight:600,cursor:"pointer"}}>
        ✓ J'ai déjà effectué le virement — notifier le syndic
      </button>
    </div>
  );
}

// Bouton copier dans le presse-papiers
function CopyBtn({ text, label="Copier" }) {
  const [done, setDone] = useState(false);
  function copy() {
    navigator.clipboard.writeText(text).then(()=>{
      setDone(true); setTimeout(()=>setDone(false), 2000);
    }).catch(()=>{
      // Fallback pour les navigateurs sans clipboard API
      const el=document.createElement("textarea");
      el.value=text; document.body.appendChild(el); el.select();
      document.execCommand("copy"); document.body.removeChild(el);
      setDone(true); setTimeout(()=>setDone(false), 2000);
    });
  }
  return (
    <button onClick={copy} style={{padding:"3px 10px",borderRadius:6,border:`1px solid ${done?"#166834":"#1a3a5f"}`,background:done?"#14532d22":"transparent",color:done?"#4ade80":"#64748b",fontFamily:"system-ui",fontSize:11,cursor:"pointer",whiteSpace:"nowrap",transition:"all 0.2s"}}>
      {done?"✓ Copié !":"📋 "+label}
    </button>
  );
}
