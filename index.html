// ── Calcul eau (logique exacte) ────────────────────────
// 1. Chaque propriétaire saisit son index actuel
// 2. Conso brute = index actuel - index précédent
// 3. Total conso brute vs total facture → différence répartie également
// 4. Conso ajustée = conso brute - (diff / nb propriétaires)
// 5. Prix m³ = montant facture / m³ facturés
// 6. Part = conso ajustée × prix m³
function calcEauParts(releves, totalBill, invoiceM3) {
  const n = releves.length;
  if (!n || !totalBill || !invoiceM3) return null;

  // Conso brute de chaque propriétaire
  const consos = releves.map(r => Number(r.m3));
  const totalConsoRelevee = consos.reduce((s,v)=>s+v, 0);

  // Différence entre total relevé et total facturé → répartie également
  const diff = Number(invoiceM3) - totalConsoRelevee;
  const adjustPerOwner = diff / n;

  // Conso ajustée de chaque propriétaire
  const consosAjustees = consos.map(c => Math.max(0, c + adjustPerOwner));

  // Prix m³ exact
  const priceM3 = Number(totalBill) / Number(invoiceM3);

  // Montants bruts
  const rawAmounts = consosAjustees.map(c => c * priceM3);

  // Arrondi avec ajustement du dernier pour total exact
  const rounded = rawAmounts.map(v => Math.round(v * 100) / 100);
  const totalRounded = rounded.reduce((s,v)=>s+v, 0);
  const lastAdj = Math.round((Number(totalBill) - totalRounded) * 100) / 100;
  rounded[rounded.length-1] = Math.round((rounded[rounded.length-1] + lastAdj) * 100) / 100;

  return releves.map((r, i) => ({
    owner:       r.ownerId,
    ownerName:   r.ownerName,
    amount:      rounded[i],
    m3Raw:       consos[i],
    m3Ajuste:    Math.round(consosAjustees[i] * 1000) / 1000,
    adjustment:  Math.round(adjustPerOwner * 1000) / 1000,
    currentIndex: r.currentIndex,
    lastIndex:   r.lastIndex,
    priceM3:     priceM3,
    paid:        false,
    paidDate:    null,
  }));
}

// ── Firebase init ───────────────────────────────────────
let _fbDB  = null;
let _fbRef = null;
let _fbReady = false;

async function initFirebase() {
  if (_fbReady) return true;
  try {
    if (!window.__fb_loaded) {
      await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js");
      window.__fb_loaded = true;
    }
    if (!window.__fb_app) {
      window.__fb_app = firebase.initializeApp(FIREBASE_CONFIG);
    }
    _fbDB  = firebase.database();
    _fbRef = _fbDB.ref(FB_PATH);
    _fbReady = true;
    console.log("✅ Firebase connecté");
    return true;
  } catch(e) {
    console.warn("Firebase init failed:", e.message);
    return false;
  }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ── Score (choisir la meilleure version) ────────────────
function score(d) {
  if (!d?.superAdmin) return 0;
  return 1 + (d.copros||[]).reduce((s,c)=>
    s + (c.users||[]).length*100 + (c.appels||[]).length*10 + (c.depenses||[]).length, 0);
}

// ── Sauvegarde locale synchrone ─────────────────────────
function saveLocalOnly(db) {
  if (!db?.superAdmin) return;
  const json = JSON.stringify(db);
  try { localStorage.setItem(LS_PRIMARY,   json); } catch {}
  try { localStorage.setItem(LS_BACKUP,    json); } catch {}
  try { localStorage.setItem(LS_EMERGENCY, json); } catch {}
  try { window.storage.set(WS_KEY, json).catch(()=>{}); } catch {}
}

// ── Sauvegarde complète (local + Firebase) ──────────────
let _saveDebounce = null;
async function saveSync(db) {
  if (!db?.superAdmin) return;
  // 1. Local SYNCHRONE immédiat
  saveLocalOnly(db);
  // 2. Firebase avec debounce 1.5s
  if (_saveDebounce) clearTimeout(_saveDebounce);
  _saveDebounce = setTimeout(async () => {
    try {
      const ok = await initFirebase();
      if (ok && _fbRef) {
        await _fbRef.set(db);
        console.log("☁️ Firebase sync OK");
      }
    } catch(e) {
      console.warn("Firebase write failed (local OK):", e.message);
    }
  }, 1500);
}

// ── Chargement initial (Firebase + local) ───────────────
async function load() {
  let best = null, bestScore = 0;

  function tryUpdate(d) {
    const s = score(d);
    if (s > bestScore) { best = d; bestScore = s; }
  }

  // 1. Firebase (source la plus à jour)
  try {
    const ok = await initFirebase();
    if (ok && _fbRef) {
      const snap = await _fbRef.once("value");
      const d = snap.val();
      if (d?.superAdmin) { tryUpdate(d); console.log("☁️ Firebase chargé"); }
    }
  } catch(e) { console.warn("Firebase load failed, fallback local:", e.message); }

  // 2. localStorage
  for (const k of [LS_PRIMARY, LS_BACKUP, LS_EMERGENCY]) {
    try { const r = localStorage.getItem(k); if (r) tryUpdate(JSON.parse(r)); } catch {}
  }

  // 3. window.storage
  try {
    const r = await window.storage.get(WS_KEY);
    if (r?.value) tryUpdate(JSON.parse(r.value));
  } catch {}

  // 4. Anciennes clés (migration)
  for (const k of ["COPRO_A","COPRO_B","COPRO_C","copro-manager-autosave"]) {
    try { const r = localStorage.getItem(k); if (r) tryUpdate(JSON.parse(r)); } catch {}
    try { const r = await window.storage.get(k); if (r?.value) tryUpdate(JSON.parse(r.value)); } catch {}
  }

  if (best) {
    console.log(`✅ Données chargées (score ${bestScore}): ${best.copros?.length||0} copros`);
    saveSync(best);
    return { ...EMPTY, ...best, copros: best.copros||[] };
  }
  return null;
}

// ── Écoute temps réel Firebase ──────────────────────────
let _unsubscribe = null;
async function startRealtimeSync(onUpdate) {
  try {
    const ok = await initFirebase();
    if (!ok || !_fbRef) return;
    _unsubscribe = _fbRef.on("value", snap => {
      const d = snap.val();
      if (d?.superAdmin) {
        saveLocalOnly(d); // sync locale silencieuse
        onUpdate(d);
      }
    });
    console.log("🔄 Écoute temps réel active");
  } catch(e) { console.warn("Realtime sync failed:", e.message); }
}
function stopRealtimeSync() {
  if (_fbRef && _unsubscribe) { _fbRef.off("value", _unsubscribe); _unsubscribe = null; }
}

// Export JSON
function exportJSON(db) {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `copro-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// Import JSON
function importJSON(file, onDone) {
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (d?.superAdmin) onDone(d);
      else alert("Fichier invalide.");
    } catch { alert("Erreur de lecture."); }
  };
  r.readAsText(file);
}

// ── Utilitaires ───────────────────────────────────────
const uid   = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fEUR  = n => Number(n).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const fDATE = s => new Date(s).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});
const fM3   = n => Number(n).toFixed(3);
const TODAY = () => new Date().toISOString().slice(0,10);

function hash(p) {
  let h = 5381;
  for (let i=0;i<p.length;i++) h=((h<<5)+h)^p.charCodeAt(i);
  return (h>>>0).toString(16);
}

function splitEqual(total, n) {
  const base = Math.round(total/n*100)/100;
  const arr = Array(n).fill(base);
  const diff = Math.round((total - arr.reduce((s,v)=>s+v,0))*100)/100;
  arr[n-1] = Math.round((arr[n-1]+diff)*100)/100;
  return arr;
}

function splitByM3(consos, total) {
  const tc = consos.reduce((s,v)=>s+v,0);
  if (!tc) return Array(consos.length).fill(0);
  const raw = consos.map(c=>(c/tc)*total);
  const arr = raw.map(v=>Math.round(v*100)/100);
  const diff = Math.round((total-arr.reduce((s,v)=>s+v,0))*100)/100;
  arr[arr.length-1]=Math.round((arr[arr.length-1]+diff)*100)/100;
  return arr;
}

// ═══════════════════════════════════════════════════════
//  APP ROOT
// ═══════════════════════════════════════════════════════
function App() {
  const [db, _setDb]       = useState(null);
  const [screen, setScreen] = useState("boot");
  const [session, setSession] = useState(null);
  const [lastSaved, setLastSaved] = useState(null); // timestamp dernière sauvegarde
  const dbRef  = useRef(null);
  const autoSaveTimer = useRef(null);

  const setDb = useCallback((d) => {
    dbRef.current = d;
    _setDb(d);
  }, []);

  // persist — local immédiat + Firebase async
  const persist = useCallback((newDb) => {
    if (!newDb?.superAdmin) return;
    dbRef.current = newDb;
    _setDb(newDb);
    setLastSaved(Date.now());
    saveSync(newDb); // local sync + Firebase async
  }, []);

  const persistCopro = useCallback((copro) => {
    const cur = dbRef.current;
    if (!cur) return;
    const newDb = { ...cur, copros: cur.copros.map(c=>c.id===copro.id?copro:c) };
    persist(newDb);
  }, [persist]);

  // ── Chargement initial ──
  useEffect(() => {
    const FRESH = { ...EMPTY, superAdmin:{ name:"Super Admin", login:"admin", password:hash("admin123") }, copros:[] };
    const t = setTimeout(() => { saveSync(FRESH); setDb(FRESH); setScreen("login"); }, 8000);

    load().then(d => {
      clearTimeout(t);
      const final = d || FRESH;
      if (!d) saveSync(FRESH);
      dbRef.current = final;
      setDb(final);
      setLastSaved(Date.now());
      setScreen("login");
    }).catch(() => {
      clearTimeout(t);
      saveSync(FRESH);
      dbRef.current = FRESH;
      setDb(FRESH);
      setScreen("login");
    });
  }, []);

  // ── Auto-save toutes les 30 secondes ──
  useEffect(() => {
    autoSaveTimer.current = setInterval(() => {
      const cur = dbRef.current;
      if (cur?.superAdmin) {
        saveSync(cur);
        setLastSaved(Date.now());
      }
    }, 30 * 1000);
    return () => clearInterval(autoSaveTimer.current);
  }, []);

  // ── Écoute Firebase temps réel ──
  useEffect(() => {
    // Démarrer la sync temps réel après chargement initial
    const timer = setTimeout(() => {
      startRealtimeSync((remoteDb) => {
        const cur = dbRef.current;
        // Mettre à jour si Firebase a des données et que le score est >= local
        // (inclut le cas où local est vide = score 0)
        if (remoteDb?.superAdmin && score(remoteDb) >= score(cur)) {
          console.log("🔄 Sync Firebase → local");
          saveLocalOnly(remoteDb);
          dbRef.current = remoteDb;
          _setDb(remoteDb);
          setLastSaved(Date.now());
        }
      });
    }, 3000); // attendre 3s après le chargement initial
    return () => { clearTimeout(timer); stopRealtimeSync(); };
  }, []); // eslint-disable-line

  // ── Sauvegarde automatique avant fermeture de page ──
  useEffect(() => {
    function handleUnload() {
      const cur = dbRef.current;
      if (!cur?.superAdmin) return;
      // saveSync est déjà synchrone — parfait pour beforeunload
      saveSync(cur);
      console.log("🔒 Sauvegarde avant fermeture OK");
    }
    window.addEventListener("beforeunload", handleUnload);
    window.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") handleUnload();
    });
    return () => {
      window.removeEventListener("beforeunload", handleUnload);
    };
  }, []);

  function logout() { setSession(null); setScreen("login"); }

  const handleImport = (file) => {
    importJSON(file, async (d) => {
      await persist(d);
      alert("✅ Données importées avec succès !");
      setScreen("login");
    });
  };

  if (screen==="boot") return <Splash />;

  if (screen==="login") return (
    <LoginPage db={db}
      onSuperAdmin={() => setScreen("super-admin")}
      onMember={(user,copro) => { setSession({user,copro}); setScreen("app"); }}
      onImport={handleImport}
    />
  );

  if (screen==="super-admin") return (
    <SuperAdmin db={db} persist={persist} persistCopro={persistCopro}
      onLogout={logout} lastSaved={lastSaved}
      onExport={() => exportJSON(db)}
      onImport={handleImport}
      onEnterCopro={(copro) => {
        const u = {id:"__admin__",name:db.superAdmin.name+" (Admin)",role:"syndic",type:"proprietaire",active:true};
        setSession({user:u,copro,isAdmin:true});
        setScreen("app");
      }}
    />
  );

  if (screen==="app" && session) {
    const liveCopro = db?.copros?.find(c=>c.id===session.copro?.id) || session.copro;
    return (
      <CoproApp copro={liveCopro} user={session.user}
        onPersistCopro={persistCopro}
        onLogout={logout} lastSaved={lastSaved}
        onBackAdmin={session.isAdmin ? ()=>setScreen("super-admin") : null}
        onExport={() => exportJSON(db)}
      />
    );
  }

  return <Splash />;
}

// ═══════════════════════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════════════════════
function LoginPage({ db, onSuperAdmin, onMember, onImport }) {
  const [login, setLogin] = useState("");
  const [pass,  setPass]  = useState("");
  const [err,   setErr]   = useState("");
  const [busy,  setBusy]  = useState(false);
  const fileRef = useRef();

  function attempt() {
    if (!login.trim()||!pass) return;
    setErr(""); setBusy(true);
    setTimeout(() => {
      setBusy(false);
      const h = hash(pass);
      if (db?.superAdmin && login.trim().toLowerCase()===db.superAdmin.login && h===db.superAdmin.password) {
        onSuperAdmin(); return;
      }
      for (const c of (db?.copros||[])) {
        const u = (c.users||[]).find(u=>u.login===login.trim().toLowerCase()&&u.password===h&&u.active);
        if (u) { onMember(u,c); return; }
      }
      setErr("Identifiant ou mot de passe incorrect.");
      setPass("");
    }, 400);
  }

  return (
    <div style={{minHeight:"100vh",background:"#07090f",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:380}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{width:68,height:68,borderRadius:20,background:"linear-gradient(135deg,#1d4ed8,#3b82f6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:34,margin:"0 auto 16px",boxShadow:"0 8px 32px #1d4ed855"}}>🏢</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:24,fontWeight:700,color:"#f0f9ff"}}>CoproManager</div>
          <div style={{fontFamily:"system-ui",fontSize:13,color:"#475569",marginTop:4}}>Gestion de copropriété</div>
        </div>

        <div style={{background:"#0c1829",borderRadius:18,padding:"30px 26px",border:"1px solid #1a3a5f33",boxShadow:"0 24px 60px rgba(0,0,0,0.5)"}}>
          <div style={{fontFamily:"system-ui",fontSize:15,fontWeight:700,color:"#e2e8f0",marginBottom:22}}>Connexion</div>

          <FL label="Identifiant (email ou téléphone)">
            <FI value={login} onChange={setLogin} placeholder="votre identifiant" onKey={e=>e.key==="Enter"&&attempt()} autoFocus />
          </FL>
          <FL label="Mot de passe">
            <FI type="password" value={pass} onChange={setPass} placeholder="••••••••" onKey={e=>e.key==="Enter"&&attempt()} />
          </FL>

          {err && <Err>{err}</Err>}

          <Btn onClick={attempt} disabled={!login.trim()||!pass||busy} full style={{marginTop:4}}>
            {busy?"Vérification…":"Se connecter →"}
          </Btn>

          <div style={{marginTop:18,paddingTop:16,borderTop:"1px solid #1a3a5f33",textAlign:"center"}}>
            <button onClick={()=>fileRef.current.click()} style={{background:"none",border:"1px solid #1a3a5f",color:"#64748b",padding:"7px 16px",borderRadius:9,cursor:"pointer",fontFamily:"system-ui",fontSize:12}}>
              📂 Restaurer une sauvegarde (.json)
            </button>
            <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>e.target.files[0]&&onImport(e.target.files[0])} />
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  SUPER ADMIN
// ═══════════════════════════════════════════════════════
function SuperAdmin({ db, persist, persistCopro, onLogout, onExport, onImport, onEnterCopro, lastSaved }) {

  const [selCopro, setSelCopro] = useState(null);

  // Toujours utiliser la copro fraîche depuis db
  const activeCopro = selCopro ? db.copros.find(c=>c.id===selCopro.id)||selCopro : null;

  const fileRef = useRef();

  return (
    <div style={S.root}>
      <header style={S.header}>
        <div>
          <div style={S.eyebrow}>Super Administrateur</div>
          <div style={S.title}>CoproManager</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <SaveBadge lastSaved={lastSaved} />
          <button onClick={onExport} style={{padding:"6px 14px",borderRadius:8,border:"1px solid #166834",background:"#14532d22",color:"#4ade80",fontFamily:"system-ui",fontSize:12,fontWeight:700,cursor:"pointer"}}>
            💾 Export (.json)
          </button>
          <button onClick={()=>fileRef.current.click()} style={{padding:"6px 14px",borderRadius:8,border:"1px solid #1a3a5f",background:"transparent",color:"#64748b",fontFamily:"system-ui",fontSize:12,cursor:"pointer"}}>
            📂 Restaurer
          </button>
          <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>e.target.files[0]&&onImport(e.target.files[0])} />
          <SmBtn onClick={onLogout} danger>Déconnexion</SmBtn>
        </div>
      </header>

      {/* Barre de statut sauvegarde */}
      <DataStatusBar lastSaved={lastSaved} db={db} onExport={onExport} />

      <div style={S.tabBar}>
        {[{id:"copros",l:"🏢 Copropriétés"},{id:"compte",l:"⚙️ Mon compte"}].map(t=>(
          <button key={t.id} onClick={()=>{setTab(t.id);if(t.id!=="users")setSelCopro(null);}} style={{...S.tabBtn,...(tab===t.id&&!selCopro?S.tabAct:{})}}>
            {t.l}
          </button>
        ))}
        {activeCopro && (
          <button onClick={()=>setTab("users")} style={{...S.tabBtn,...(tab==="users"?S.tabAct:{}),marginLeft:8,borderLeft:"1px solid #1a3a5f",paddingLeft:16}}>
            👥 Utilisateurs — {activeCopro.name}
          </button>
        )}
      </div>

      <main style={S.main}>
        {tab==="users" && activeCopro && (
          <UsersTab copro={activeCopro} db={db} persist={persist}
            onBack={()=>{setTab("copros");setSelCopro(null);}} />
        )}
        {tab==="copros" && (
          <CoprosTab db={db} persist={persist}
            onManageUsers={c=>{setSelCopro(c);setTab("users");}}
            onEnterCopro={onEnterCopro} />
        )}
        {tab==="compte" && (
          <AccountTab db={db} persist={persist} />
        )}
      </main>
    </div>
  );
}

  function openCreate() { setEdit(null); setForm({name:"",login:"",password:"",role:"membre",type:"proprietaire",active:true,lastIndex:""}); setShowForm(true); setErr(""); }
  function openEdit(u)  { setEdit(u); setForm({...u,password:"",lastIndex:u.lastIndex||""}); setShowForm(true); setErr(""); }

  async function saveUser() {
    setErr("");
    if (!form.name.trim())  { setErr("Nom requis.");         return; }
    if (!form.login.trim()) { setErr("Identifiant requis."); return; }
    const loginLc = form.login.trim().toLowerCase();
    if (loginLc===db.superAdmin.login) { setErr("Identifiant réservé au super admin."); return; }
    const allLogins = db.copros.flatMap(c=>(c.users||[]).map(u=>({login:u.login,id:u.id})));
    if (allLogins.find(x=>x.login===loginLc&&x.id!==edit?.id)) { setErr("Identifiant déjà utilisé."); return; }

    let user;
    if (edit) {
      user = {...edit,name:form.name.trim(),login:loginLc,role:form.role,type:form.type,active:form.active};
      if (form.password) user.password = hash(form.password);
      // Index : seul l'admin peut le modifier — on garde la valeur du form
      if (form.lastIndex !== undefined && form.lastIndex !== "") {
        user.lastIndex = Number(form.lastIndex);
      }
    } else {
      if (!form.password||form.password.length<4) { setErr("Mot de passe min. 4 caractères."); return; }
      user = {id:uid(),name:form.name.trim(),login:loginLc,password:hash(form.password),role:form.role,type:form.type,active:true};
      if (form.lastIndex !== undefined && form.lastIndex !== "") {
        user.lastIndex = Number(form.lastIndex);
      }
    }

    const users = edit ? copro.users.map(u=>u.id===edit.id?user:u) : [...(copro.users||[]),user];

    if (!confirm(`Supprimer ${u.name} ?`)) return;

function AccountTab({ db, persist }) {
  const [name, setName] = useState(db.superAdmin.name);
  const [login,setLogin]= useState(db.superAdmin.login);
  const [pass, setPass] = useState("");
  const [conf, setConf] = useState("");
  const [err,  setErr]  = useState("");
  const [ok,   setOk]   = useState(false);

  async function save() {
    setErr("");
    if (!login.trim()) { setErr("Identifiant requis."); return; }
    if (pass&&pass.length<4) { setErr("Mot de passe trop court."); return; }
    if (pass&&pass!==conf) { setErr("Mots de passe différents."); return; }
    const sa = {...db.superAdmin,name:name.trim(),login:login.trim().toLowerCase()};
    if (pass) sa.password=hash(pass);
    await persist({...db,superAdmin:sa});
    setOk(true); setPass(""); setConf(""); setTimeout(()=>setOk(false),2000);
  }

  return (
    <div style={{maxWidth:480}}>
      <h2 style={S.h2}>Mon compte</h2>
      <div style={S.card}>
        <FL label="Nom"><FI value={name} onChange={setName}/></FL>
        <FL label="Identifiant de connexion"><FI value={login} onChange={setLogin}/></FL>
        <FL label="Nouveau mot de passe"><FI type="password" value={pass} onChange={setPass} placeholder="(inchangé)"/></FL>
        <FL label="Confirmer"><FI type="password" value={conf} onChange={setConf}/></FL>
        {err&&<Err>{err}</Err>}
        <Btn onClick={save}>{ok?"✓ Sauvegardé !":"Enregistrer"}</Btn>
      </div>
    </div>
  );
}

function CoproApp({ copro, user, onPersistCopro, onLogout, onBackAdmin, onExport, lastSaved }) {

    const IN  = (copro.appels||[]).flatMap(a=>(a.payments||[]).filter(p=>p.paid)).reduce((s,p)=>s+Number(p.amount),0);

  return (
    <div style={S.root}>

          )}

          {isSyndic && (
            <button onClick={onExport} style={{padding:"6px 14px",borderRadius:8,border:"1px solid #166834",background:"#14532d22",color:"#4ade80",fontFamily:"system-ui",fontSize:12,fontWeight:700,cursor:"pointer"}}>💾 Export</button>

      <div style={S.tabBar}>

          <button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tabBtn,...(tab===t.id?S.tabAct:{})}}>{t.label}</button>
        ))}
      </div>

      <main style={S.main}>
        {tab==="dashboard" && <Dashboard copro={copro} user={user} isSyndic={isSyndic} balance={balance} members={members} updateCopro={updateCopro}/>}
        {tab==="appels"    && isSyndic && <AppelsTab copro={copro} members={members} update={updateCopro}/>}
        {tab==="releve"    && !isSyndic && <ReleveTab copro={copro} user={user} update={updateCopro}/>}
        {tab==="caisse"    && isSyndic && <CaisseTab copro={copro} balance={balance} update={updateCopro}/>}
        {tab==="depenses"  && isSyndic && <DepensesTab copro={copro} update={updateCopro}/>}
        {tab==="compteurs" && isSyndic && <CompteursTab copro={copro} update={updateCopro}/>}
        {tab==="params"    && isSyndic && <ParamsTab copro={copro} update={updateCopro}/>}
      </main>
    </div>
  );
}

// ─── Saisie de l'index compteur (depuis le dashboard) ────
function InlineReleveForm({ appels, user, copro, update }) {
  const [vals, setVals] = useState({});

  // Récupère l'index précédent de l'utilisateur
  function getLastIndex(userId) {
    const user = (copro.users||[]).find(u=>u.id===userId);
    return user?.lastIndex || null;
  }

  async function submit(appelId, currentIndex) {
    const idx = Number(currentIndex);
    if (!idx || idx <= 0) return;
    const lastIdx = getLastIndex(user.id);
    const conso = lastIdx ? Math.max(0, idx - lastIdx) : idx;

    const newAppels = (copro.appels||[]).map(a => {
      if (a.id !== appelId) return a;
      const releves = [...(a.releves||[]).filter(r=>r.ownerId!==user.id), {
        ownerId: user.id,
        ownerName: user.name,
        currentIndex: idx,
        lastIndex: lastIdx,
        m3: conso,
        enteredAt: new Date().toISOString()
      }];
      return { ...a, releves };
    });

    // Mettre à jour l'index dans le profil utilisateur
    const newUsers = (copro.users||[]).map(u =>
      u.id === user.id ? { ...u, lastIndex: idx } : u
    );

    await update({ appels: newAppels, users: newUsers });
    setVals(p => ({ ...p, [appelId]: "" }));
  }

  return (
    <Sec title="💧 Facture eau — Saisissez votre index">
      {appels.map(a => {
        const r = (a.releves||[]).find(rv => rv.ownerId === user.id);
        const lastIdx = getLastIndex(user.id);
        const currentVal = vals[a.id] || "";
        const previewConso = currentVal && lastIdx ? Math.max(0, Number(currentVal) - lastIdx) : currentVal ? Number(currentVal) : null;
        const pm3 = a.priceM3 || (copro.refPriceM3 ? Number(copro.refPriceM3) : null);
        const previewEur = previewConso && pm3 ? previewConso * pm3 : null;

        return (
          <div key={a.id} style={{ ...S.card, border:`1px solid ${r?"#166834":"#f59e0b55"}` }}>
            {/* En-tête */}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 }}>
              <div>
                <div style={{ fontFamily:"system-ui", fontSize:15, fontWeight:700, color:"#f0f9ff" }}>💧 {a.title}</div>
                <div style={{ fontFamily:"system-ui", fontSize:12, color:"#64748b", marginTop:3 }}>
                  {fDATE(a.date)}
                  {a.totalBill && <span style={{color:"#f59e0b",marginLeft:8}}>Facture totale : {fEUR(a.totalBill)}</span>}
                </div>
              </div>
              <span style={{ fontFamily:"system-ui",fontSize:11,padding:"3px 10px",borderRadius:20,
                background:r?"#14532d":"#f59e0b22",color:r?"#4ade80":"#f59e0b"}}>
                {r?"✓ Index saisi":"⏳ À saisir"}
              </span>
            </div>

            {r ? (
              /* Index déjà saisi */
              <div style={{ background:"#14532d22",borderRadius:10,padding:"16px",border:"1px solid #166834" }}>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12, marginBottom:12 }}>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ fontFamily:"system-ui",fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:1,marginBottom:4 }}>Index précédent</div>
                    <div style={{ fontFamily:"system-ui",fontSize:16,fontWeight:700,color:"#94a3b8" }}>
                      {r.lastIndex ? fM3(r.lastIndex) : "—"} <span style={{fontSize:11}}>m³</span>
                    </div>
                  </div>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ fontFamily:"system-ui",fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:1,marginBottom:4 }}>Index actuel</div>
                    <div style={{ fontFamily:"system-ui",fontSize:16,fontWeight:700,color:"#38bdf8" }}>
                      {fM3(r.currentIndex)} <span style={{fontSize:11}}>m³</span>
                    </div>
                  </div>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ fontFamily:"system-ui",fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:1,marginBottom:4 }}>Consommation</div>
                    <div style={{ fontFamily:"system-ui",fontSize:16,fontWeight:700,color:"#4ade80" }}>
                      {fM3(r.m3)} <span style={{fontSize:11}}>m³</span>
                    </div>
                  </div>
                </div>
                {pm3 && (
                  <div style={{ background:"#060c16",borderRadius:8,padding:"10px 12px",fontFamily:"system-ui",fontSize:13,textAlign:"center" }}>
                    <span style={{color:"#64748b"}}>{fM3(r.m3)} m³ × {pm3.toFixed(4)} €/m³ = </span>
                    <strong style={{color:"#f59e0b",fontSize:16}}>{fEUR(r.m3 * pm3)}</strong>
                    <div style={{color:"#475569",fontSize:11,marginTop:2}}>estimation — le montant exact sera calculé après que tous aient saisi</div>
                  </div>
                )}
                <div style={{textAlign:"right",marginTop:10}}>
                  <button onClick={()=>update({appels:(copro.appels||[]).map(x=>x.id!==a.id?x:{...x,releves:(x.releves||[]).filter(rv=>rv.ownerId!==user.id)})})}
                    style={{background:"none",border:"1px solid #1a3a5f",color:"#64748b",padding:"5px 14px",borderRadius:8,cursor:"pointer",fontFamily:"system-ui",fontSize:12}}>
                    ✏️ Modifier
                  </button>
                </div>
              </div>
            ) : (
              /* Saisie de l'index */
              <div>
                {lastIdx && (
                  <div style={{ background:"#0a1628",borderRadius:8,padding:"10px 12px",marginBottom:12,fontFamily:"system-ui",fontSize:12,display:"flex",justifyContent:"space-between" }}>
                    <span style={{color:"#64748b"}}>Votre dernier index enregistré :</span>
                    <strong style={{color:"#38bdf8"}}>{fM3(lastIdx)} m³</strong>
                  </div>
                )}

                <FL label="Votre index actuel (relevé sur votre compteur)">
                  <div style={{display:"flex",gap:10}}>
                    <div style={{position:"relative",flex:1}}>
                      <input type="number" min="0" step="0.001"
                        value={currentVal}
                        onChange={e=>setVals(p=>({...p,[a.id]:e.target.value}))}
                        onKeyDown={e=>e.key==="Enter"&&submit(a.id,currentVal)}
                        placeholder={lastIdx ? `> ${fM3(lastIdx)}` : "ex: 1547.250"}
                        autoFocus
                        style={{...S.inp, paddingRight:42, fontSize:16, fontWeight:600}}/>
                      <span style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",color:"#38bdf8",fontFamily:"system-ui",fontSize:13,fontWeight:700}}>m³</span>
                    </div>
                    <button onClick={()=>submit(a.id,currentVal)}
                      disabled={!currentVal||Number(currentVal)<=0||(lastIdx&&Number(currentVal)<=lastIdx)}
                      style={{padding:"0 22px",borderRadius:10,border:"none",
                        background:(!currentVal||Number(currentVal)<=0)?"#1e3a5f":"linear-gradient(135deg,#059669,#10b981)",
                        color:(!currentVal||Number(currentVal)<=0)?"#475569":"#fff",
                        fontFamily:"system-ui",fontSize:14,fontWeight:700,
                        cursor:(!currentVal||Number(currentVal)<=0)?"not-allowed":"pointer",whiteSpace:"nowrap"}}>
                      ✓ Valider
                    </button>
                  </div>
                </FL>

                {/* Preview en temps réel */}
                {previewConso !== null && previewConso >= 0 && (
                  <div style={{background:"#0a1628",borderRadius:10,padding:"12px",border:"1px solid #1a3a5f44",marginTop:4}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontFamily:"system-ui",fontSize:13,marginBottom:6}}>
                      <span style={{color:"#64748b"}}>Consommation calculée :</span>
                      <strong style={{color:"#38bdf8"}}>{fM3(previewConso)} m³</strong>
                    </div>
                    {lastIdx && <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569",marginBottom:8}}>
                      {Number(currentVal).toFixed(3)} − {fM3(lastIdx)} = {fM3(previewConso)} m³
                    </div>}
                    {previewEur !== null && (
                      <div style={{display:"flex",justifyContent:"space-between",fontFamily:"system-ui",fontSize:14,fontWeight:700}}>
                        <span style={{color:"#64748b"}}>Votre part estimée :</span>
                        <span style={{color:"#f59e0b"}}>{fEUR(previewEur)}</span>
                      </div>
                    )}
                  </div>
                )}

                {lastIdx && currentVal && Number(currentVal) <= lastIdx && Number(currentVal) > 0 && (
                  <div style={{fontFamily:"system-ui",fontSize:12,color:"#f87171",marginTop:6}}>
                    ⚠️ L'index actuel doit être supérieur à l'index précédent ({fM3(lastIdx)} m³)
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </Sec>
  );
}

// ─── Dashboard ────────────────────────────────────────
function Dashboard({ copro, user, isSyndic, balance, members, updateCopro }) {
  const myPending = (copro.appels||[])
    .filter(a => a.status !== "open") // exclure eau en attente de relevés (montant pas encore calculé)
    .flatMap(a =>
      (a.payments||[])
        .filter(p => p.owner===user.id && !p.paid && Number(p.amount) > 0)
        .map(p => ({
          ...p,
          appelTitle: a.title,
          appelDate:  a.date,
          appelType:  a.type,
          totalBill:  a.totalBill,
          priceM3:    a.priceM3 || null,
          totalConso: a.totalConso || null,
        }))
    );
  const openReleves = (copro.appels||[]).filter(a=>a.type==="eau"&&a.status==="open");

  return (
    <div>
      <div style={{...S.card,background:"linear-gradient(135deg,#0d1e38,#0a1628)",border:"1px solid #1d4ed833",marginBottom:20}}>
        <div style={{fontFamily:"system-ui",fontSize:13,color:"#475569",marginBottom:4}}>Bienvenue,</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:22,fontWeight:700,color:"#f0f9ff",marginBottom:isSyndic?16:0}}>{user.name}</div>
        {isSyndic && (
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
            <MK label="Solde"         val={fEUR(balance)}    color={balance>=0?"#4ade80":"#f87171"}/>
            <MK label="Appels actifs" val={(copro.appels||[]).filter(a=>a.status!=="complete").length} color="#60a5fa"/>
            <MK label="Membres"       val={members.length}   color="#a78bfa"/>
          </div>
        )}
      </div>

      {myPending.length>0 && (
        <Sec title={`⚠️ À payer (${myPending.length})`}>
          {myPending.map((p,i)=>(
            <div key={i} style={{...S.card,border:"1px solid #f59e0b44",marginBottom:10}}>
              {/* En-tête : titre + montant */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span style={{fontSize:16}}>{p.appelType==="eau"?"💧":p.appelType==="assurance"?"🛡️":"📁"}</span>
                    <span style={{fontFamily:"system-ui",fontWeight:700,color:"#fde68a",fontSize:15}}>{p.appelTitle}</span>
                  </div>
                  <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b"}}>{fDATE(p.appelDate)}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"Georgia,serif",fontSize:26,fontWeight:700,color:"#f59e0b"}}>{fEUR(p.amount)}</div>
                  <div style={{fontFamily:"system-ui",fontSize:11,color:"#64748b"}}>à virer</div>
                </div>
              </div>

              {/* Détail calcul — comme sur la feuille de calcul */}
              <div style={{background:"#060c16",borderRadius:10,padding:"14px",border:"1px solid #1a3a5f44",marginBottom:12}}>
                <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>📊 Détail du calcul</div>
                {p.appelType==="eau" && (
                  <div>
                    {/* Index */}
                    {(p.currentIndex||p.lastIndex) && (
                      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
                        <div style={{textAlign:"center"}}>
                          <div style={{fontFamily:"system-ui",fontSize:10,color:"#475569",textTransform:"uppercase",marginBottom:3}}>Index précédent</div>
                          <div style={{fontFamily:"system-ui",fontSize:15,fontWeight:700,color:"#94a3b8"}}>{p.lastIndex?fM3(p.lastIndex):"—"}</div>
                        </div>
                        <div style={{textAlign:"center"}}>
                          <div style={{fontFamily:"system-ui",fontSize:10,color:"#475569",textTransform:"uppercase",marginBottom:3}}>Index actuel</div>
                          <div style={{fontFamily:"system-ui",fontSize:15,fontWeight:700,color:"#38bdf8"}}>{p.currentIndex?fM3(p.currentIndex):"—"}</div>
                        </div>
                        <div style={{textAlign:"center"}}>
                          <div style={{fontFamily:"system-ui",fontSize:10,color:"#475569",textTransform:"uppercase",marginBottom:3}}>Conso relevée</div>
                          <div style={{fontFamily:"system-ui",fontSize:15,fontWeight:700,color:"#60a5fa"}}>{fM3(p.m3Raw||p.m3)} m³</div>
                        </div>
                      </div>
                    )}
                    {/* Formule de calcul */}
                    <div style={{background:"#0a1628",borderRadius:8,padding:"10px 12px",fontFamily:"system-ui",fontSize:12}}>
                      {p.adjustment!==undefined && p.adjustment!==0 && (
                        <div style={{color:"#64748b",marginBottom:6}}>
                          Ajustement (écart facture/relevés) : <span style={{color:"#f59e0b"}}>{p.adjustment>0?"+":""}{fM3(p.adjustment)} m³</span>
                        </div>
                      )}
                      {p.m3Ajuste!==undefined && p.adjustment!==0 && (
                        <div style={{color:"#64748b",marginBottom:6}}>
                          Conso ajustée : <strong style={{color:"#38bdf8"}}>{fM3(p.m3Ajuste||p.m3)} m³</strong>
                        </div>
                      )}
                      {p.priceM3 && (
                        <div style={{color:"#64748b",marginBottom:4}}>
                          <span style={{color:"#38bdf8",fontWeight:700}}>{fM3(p.m3Ajuste||p.m3)} m³</span>
                          <span> × </span>
                          <span style={{color:"#a78bfa",fontWeight:700}}>{p.priceM3.toFixed(4)} €/m³</span>
                          <span> = </span>
                          <strong style={{color:"#f59e0b",fontSize:15}}>{fEUR(p.amount)}</strong>
                        </div>
                      )}
                    </div>
                  </div>
                )}
                {p.appelType==="assurance" && p.totalBill && (
                  <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b"}}>
                    {fEUR(p.totalBill)} ÷ parts égales = <strong style={{color:"#818cf8"}}>{fEUR(p.amount)}</strong>
                  </div>
                )}
                {p.appelType==="autre" && (
                  <div style={{fontFamily:"system-ui",fontSize:12,color:"#94a3b8"}}>
                    Montant affecté : <strong style={{color:"#e2e8f0"}}>{fEUR(p.amount)}</strong>
                  </div>
                )}
              </div>

              {/* Instructions virement */}
              {copro.iban && (
                <div style={{background:"#0a1e38",borderRadius:10,padding:"12px",border:"1px solid #2563eb44"}}>
                  <div style={{fontFamily:"system-ui",fontSize:11,color:"#3b82f6",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>📤 Virement à effectuer</div>
                  <pre style={{fontFamily:"system-ui",fontSize:12,color:"#94a3b8",margin:0,whiteSpace:"pre-wrap"}}>{copro.iban}</pre>
                  <div style={{background:"#1d4ed833",borderRadius:7,padding:"7px 10px",marginTop:8,fontFamily:"system-ui",fontSize:12}}>
                    <span style={{color:"#64748b"}}>Référence obligatoire : </span>
                    <span style={{color:"#f0f9ff",fontWeight:700,letterSpacing:0.5}}>{p.appelTitle} — {user.name}</span>
                  </div>
                  <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569",marginTop:8,fontStyle:"italic"}}>
                    ✉️ Le syndic confirmera la réception. Votre statut passera à "Payé".
                  </div>
                </div>
              )}
            </div>
          ))}
        </Sec>
      )}

      {!isSyndic && openReleves.length>0 && (
        <InlineReleveForm appels={openReleves} user={user} copro={copro} update={updateCopro} />
      )}

      {/* Historique des index et consommations du membre */}
      {!isSyndic && (() => {
        const myUser = (copro.users||[]).find(u=>u.id===user.id);
        const myReleves = (copro.appels||[])
          .filter(a=>a.type==="eau"&&a.status!=="open")
          .flatMap(a=>(a.releves||[]).filter(r=>r.ownerId===user.id).map(r=>({...r,appelTitle:a.title,appelDate:a.date,pm3:a.priceM3})))
          .sort((a,b)=>new Date(b.appelDate)-new Date(a.appelDate));

        if (!myUser && !myReleves.length) return null;
        return (
          <Sec title="📊 Mon historique de compteur">
            {/* Index actuel */}
            <div style={{...S.card,border:"1px solid #1a3a5f",marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b",marginBottom:4}}>
                    Index enregistré sur votre compte
                  </div>
                  <div style={{fontFamily:"system-ui",fontSize:22,fontWeight:700,color:"#38bdf8"}}>
                    {myUser?.lastIndex ? `${Number(myUser.lastIndex).toFixed(3)} m³` : "Non défini"}
                  </div>
                  <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569",marginTop:3}}>
                    🔒 Modifiable uniquement par l'administrateur
                  </div>
                </div>
                <div style={{fontSize:32}}>🔢</div>
              </div>
            </div>

            {/* Historique des relevés */}
            {myReleves.length > 0 && (
              <div style={{border:"1px solid #1a3a5f33",borderRadius:12,overflow:"hidden"}}>
                <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr",background:"#060c16",padding:"9px 14px",borderBottom:"1px solid #1a3a5f22"}}>
                  {["Période","Index préc.","Index actuel","Conso m³","Montant"].map(h=>(
                    <div key={h} style={{fontFamily:"system-ui",fontSize:10,fontWeight:700,color:"#334155",letterSpacing:1,textTransform:"uppercase"}}>{h}</div>
                  ))}
                </div>
                {myReleves.map((r,i)=>(
                  <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr",padding:"10px 14px",borderBottom:i<myReleves.length-1?"1px solid #1a3a5f11":"none",background:i%2===0?"#0c1829":"#090f1d",alignItems:"center"}}>
                    <div>
                      <div style={{fontFamily:"system-ui",fontSize:12,fontWeight:600,color:"#e2e8f0"}}>{r.appelTitle}</div>
                      <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569"}}>{fDATE(r.appelDate)}</div>
                    </div>
                    <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b"}}>{r.lastIndex ? Number(r.lastIndex).toFixed(3) : "—"}</div>
                    <div style={{fontFamily:"system-ui",fontSize:12,color:"#38bdf8",fontWeight:600}}>{Number(r.currentIndex).toFixed(3)}</div>
                    <div style={{fontFamily:"system-ui",fontSize:12,color:"#4ade80",fontWeight:600}}>{Number(r.m3).toFixed(3)}</div>
                    <div style={{fontFamily:"system-ui",fontSize:12,color:"#f59e0b",fontWeight:700}}>
                      {r.pm3 ? fEUR(r.m3*r.pm3) : "—"}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Sec>
        );
      })()}

      {/* Historique des paiements du membre */}
      {!isSyndic && (() => {
        const myHistory = (copro.appels||[])
          .filter(a=>a.status!=="open")
          .flatMap(a=>(a.payments||[]).filter(p=>p.owner===user.id&&Number(p.amount)>0).map(p=>({...p,appelTitle:a.title,appelDate:a.date,appelType:a.type})))
          .sort((a,b)=>new Date(b.appelDate)-new Date(a.appelDate));
        const totalPaye = myHistory.filter(p=>p.paid).reduce((s,p)=>s+Number(p.amount),0);
        const totalDu   = myHistory.reduce((s,p)=>s+Number(p.amount),0);
        if (!myHistory.length) return null;
        return (
          <Sec title="📋 Mes charges">
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
              <MK label="Total dû"   val={fEUR(totalDu)}   color="#60a5fa"/>
              <MK label="Payé"       val={fEUR(totalPaye)} color="#4ade80"/>
              <MK label="Restant"    val={fEUR(totalDu-totalPaye)} color={totalDu-totalPaye>0?"#f59e0b":"#4ade80"}/>
            </div>
            {myHistory.map((p,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",background:S.card.background,borderRadius:10,marginBottom:6,borderLeft:`3px solid ${p.paid?"#4ade80":"#f59e0b"}`}}>
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                    <span>{p.appelType==="eau"?"💧":p.appelType==="assurance"?"🛡️":"📁"}</span>
                    <span style={{fontFamily:"system-ui",fontSize:13,fontWeight:600,color:"#e2e8f0"}}>{p.appelTitle}</span>
                  </div>
                  <div style={{fontFamily:"system-ui",fontSize:11,color:"#64748b"}}>
                    {fDATE(p.appelDate)}
                    {p.paid&&p.paidDate?` · Payé le ${fDATE(p.paidDate)}`:""}
                    {p.m3>0?` · ${fM3(p.m3)} m³`:""}
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"system-ui",fontSize:14,fontWeight:700,color:p.paid?"#4ade80":"#f59e0b"}}>{fEUR(p.amount)}</div>
                  <div style={{fontFamily:"system-ui",fontSize:10,color:p.paid?"#4ade80":"#f59e0b"}}>{p.paid?"✓ Payé":"En attente"}</div>
                </div>
              </div>
            ))}
          </Sec>
        );
      })()}

      {isSyndic && members.length>0 && (
        <Sec title="👥 État des membres">
          {members.map((m,i)=>{
            const owed=(copro.appels||[]).flatMap(a=>(a.payments||[]).filter(p=>p.owner===m.id&&!p.paid)).reduce((s,p)=>s+Number(p.amount),0);
            return (
              <div key={m.id} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",background:i%2===0?S.card.background:"#0a1628",borderRadius:10,marginBottom:6}}>
                <Av name={m.name} idx={i} size={36}/>
                <div style={{flex:1}}>
                  <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:600,color:"#e2e8f0"}}>{m.name}</div>
                  <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569"}}>{m.type==="proprietaire"?"🏠":"🔑"} {m.role}</div>
                </div>
                {owed>0?<span style={{fontFamily:"system-ui",fontWeight:700,color:"#f59e0b",fontSize:13}}>Doit {fEUR(owed)}</span>
                       :<span style={{fontFamily:"system-ui",fontSize:12,color:"#4ade80"}}>✓ À jour</span>}
              </div>
            );
          })}
        </Sec>
      )}
    </div>
  );
}

// ─── Appels de fonds ──────────────────────────────────
function AppelsTab({ copro, members, update }) {
  const [show,  setShow]  = useState(false);
  const [type,  setType]  = useState("eau");
  const [title, setTitle] = useState("");
  const [date,  setDate]  = useState(TODAY());
  const [note,  setNote]  = useState("");
  const [bill,  setBill]  = useState("");
  const [invM3, setInvM3] = useState("");
  const [mAmts,   setMAmts]   = useState({});
  const [mConsos, setMConsos] = useState({});
  const [saisieMode, setSaisieMode] = useState('syndic'); // 'syndic' | 'membres'

  function handleBill(v) {
    setBill(v);
    if (copro.refPriceM3&&Number(copro.refPriceM3)>0&&v&&Number(v)>0)
      setInvM3((Number(v)/Number(copro.refPriceM3)).toFixed(3));
  }

  const priceM3    = invM3&&bill&&Number(invM3)>0 ? Number(bill)/Number(invM3) : null;
  const totalConso = members.reduce((s,m)=>s+(Number(mConsos[m.id])||0),0);

  const canCreate =
    type==="eau"        ? (title.trim() && bill && Number(bill)>0 && invM3 && Number(invM3)>0)
    : type==="assurance" ? (title.trim() && copro.assuranceAnnuelle && Number(copro.assuranceAnnuelle)>0)
    :                      (title.trim() && members.length>0 && members.every(m=>mAmts[m.id]&&!isNaN(Number(mAmts[m.id]))));

  async function create() {
    let ap = {id:uid(),title:title.trim(),date,note,type,status:"active",createdAt:new Date().toISOString()};
    if (type==="eau") {
      const bill_n = Number(bill);
      // Prix m³ : depuis paramètres ou saisi manuellement
      const pm3 = copro.refPriceM3 && Number(copro.refPriceM3)>0
        ? Number(copro.refPriceM3)
        : invM3 && Number(invM3)>0 ? Number(invM3) : null;
      // Appel créé en statut "open" — chaque membre saisit son index
      ap = {
        ...ap,
        totalBill: bill_n,
        priceM3: pm3,
        status: "open",
        releves: [],   // index saisis par chaque membre
        payments: members.map(m=>({ owner:m.id, ownerName:m.name, amount:0, m3:0, paid:false, paidDate:null }))
      };
    } else if (type==="assurance") {
      const total=Number(copro.assuranceAnnuelle);
      const shares=splitEqual(total,members.length);
      ap={...ap,totalBill:total,payments:members.map((m,i)=>({owner:m.id,ownerName:m.name,amount:shares[i],paid:false,paidDate:null}))};
    } else {
      const pmts=members.map(m=>({owner:m.id,ownerName:m.name,amount:Number(mAmts[m.id]||0),paid:false,paidDate:null}));
      ap={...ap,totalBill:pmts.reduce((s,p)=>s+p.amount,0),payments:pmts};
    }
    await update({appels:[ap,...(copro.appels||[])]});
    setTitle(""); setBill(""); setInvM3(""); setNote(""); setMAmts({}); setMConsos({}); setSaisieMode("syndic"); setShow(false);
  }

  async function validateReleves(id) {
    const appels=(copro.appels||[]).map(a=>{
      if (a.id!==id) return a;
      const invoiceM3 = a.invoiceM3;
      if (!invoiceM3) return a;
      // Utilise le moteur de calcul exact (avec ajustement proportionnel)
      const payments = calcEauParts(a.releves, a.totalBill, invoiceM3);
      if (!payments) return a;
      const tc = a.releves.reduce((s,r)=>s+Number(r.m3),0);
      const pm3 = a.totalBill / invoiceM3;
      return { ...a, payments, totalConso:tc, priceM3:pm3, status:"active" };
    });
    await update({appels});
  }

  // Auto-validation quand tous les membres ont saisi
  useEffect(() => {
    const openEau = (copro.appels||[]).filter(a=>a.type==="eau"&&a.status==="open");
    openEau.forEach(a => {
      const allIn = members.length > 0 && (a.releves||[]).length >= members.length;
      if (allIn) validateReleves(a.id);
    });
  }, [copro.appels]);

  async function togglePaid(appelId,ownerId) {
    const appels=(copro.appels||[]).map(a=>{
      if (a.id!==appelId) return a;
      const payments=(a.payments||[]).map(p=>p.owner!==ownerId?p:{...p,paid:!p.paid,paidDate:!p.paid?new Date().toISOString():null});
      return {...a,payments,status:payments.every(p=>p.paid)?"complete":"active"};
    });
    await update({appels});
  }

  async function delAppel(id) {
    if (!confirm("Supprimer ?")) return;
    await update({appels:(copro.appels||[]).filter(a=>a.id!==id)});
  }

  const sorted=[...(copro.appels||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h2 style={S.h2}>Appels de fonds</h2>
        <Btn small onClick={()=>setShow(!show)}>{show?"✕ Annuler":"+ Nouvel appel"}</Btn>
      </div>

      {members.length===0&&show&&(
        <div style={{...S.card,border:"1px solid #f59e0b44",marginBottom:14}}>
          <div style={{fontFamily:"system-ui",fontSize:13,color:"#fde68a"}}>⚠️ Aucun membre actif dans cette copropriété. Ajoutez d'abord des utilisateurs depuis l'espace Admin.</div>
        </div>
      )}

      {show && (
        <div style={S.card}>
          <div style={{display:"flex",gap:8,marginBottom:18}}>
            {[{id:"eau",l:"💧 Eau"},{id:"assurance",l:"🛡️ Assurance"},{id:"autre",l:"📁 Autre"}].map(t=>(
              <button key={t.id} onClick={()=>setType(t.id)} style={{flex:1,padding:"9px 4px",borderRadius:10,border:`2px solid ${type===t.id?"#2563eb":"#1a3a5f"}`,background:type===t.id?"#1d4ed822":"transparent",color:type===t.id?"#7dd3fc":"#64748b",fontFamily:"system-ui",fontWeight:700,fontSize:13,cursor:"pointer"}}>{t.l}</button>
            ))}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <FL label="Titre *"><FI value={title} onChange={setTitle} placeholder={type==="eau"?"Eau T2 2025":type==="assurance"?"Assurance 2025":"Libellé"}/></FL>
            <FL label="Date"><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={S.inp}/></FL>
          </div>

          {type==="eau" && (
            <div style={{background:"#060c16",borderRadius:12,padding:"18px",border:"1px solid #1a3a5f",marginBottom:4}}>
              <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:700,color:"#60a5fa",marginBottom:16}}>
                💧 Facture d'eau
              </div>

              {/* Montant TTC */}
              <FL label="Montant total TTC à rembourser (€)">
                <NIn value={bill} onChange={handleBill} placeholder="0.00" unit="€"/>
              </FL>

              {/* m³ total facturé — OBLIGATOIRE */}
              <FL label="💧 Total m³ indiqué sur la facture *">
                <NIn value={invM3} onChange={setInvM3} placeholder="ex: 195.000" unit="m³"/>
                {invM3 && bill && Number(invM3)>0 && Number(bill)>0 && (
                  <div style={{fontFamily:"system-ui",fontSize:12,color:"#a78bfa",marginTop:5}}>
                    Prix m³ : <strong>{(Number(bill)/Number(invM3)).toFixed(4)} €/m³</strong>
                  </div>
                )}
                {!invM3 && copro.refPriceM3 && bill && Number(bill)>0 && (
                  <div style={{fontFamily:"system-ui",fontSize:11,color:"#64748b",marginTop:5}}>
                    Estimation depuis tarif : {(Number(bill)/Number(copro.refPriceM3)).toFixed(3)} m³
                    <button onClick={()=>setInvM3((Number(bill)/Number(copro.refPriceM3)).toFixed(3))}
                      style={{marginLeft:8,background:"none",border:"none",color:"#3b82f6",cursor:"pointer",fontSize:11,textDecoration:"underline"}}>
                      Utiliser
                    </button>
                  </div>
                )}
              </FL>

              {/* Explication du fonctionnement */}
              <div style={{background:"#0a1e38",borderRadius:10,padding:"12px 14px",border:"1px solid #2563eb33",marginTop:4}}>
                <div style={{fontFamily:"system-ui",fontSize:12,fontWeight:700,color:"#60a5fa",marginBottom:8}}>
                  ℹ️ Comment ça marche
                </div>
                <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b",lineHeight:1.8}}>
                  1. Vous créez cet appel avec le montant de la facture<br/>
                  2. Chaque propriétaire se connecte et saisit son <strong style={{color:"#e2e8f0"}}>index actuel</strong> du compteur<br/>
                  3. L'app calcule automatiquement : <strong style={{color:"#38bdf8"}}>index actuel − index précédent = m³ consommés</strong><br/>
                  4. Chaque propriétaire voit exactement <strong style={{color:"#4ade80"}}>ce qu'il vous doit en €</strong>
                </div>
                {members.length > 0 && (
                  <div style={{marginTop:12,paddingTop:10,borderTop:"1px solid #1a3a5f33"}}>
                    <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569",marginBottom:6}}>Index précédents enregistrés :</div>
                    {members.map((m,i)=>{
                      const lastIdx = m.lastIndex;
                      return (
                        <div key={i} style={{display:"flex",justifyContent:"space-between",fontFamily:"system-ui",fontSize:12,color:"#64748b",marginBottom:3}}>
                          <span>{m.name}</span>
                          <span style={{color: lastIdx ? "#38bdf8" : "#f59e0b"}}>
                            {lastIdx ? `Index précédent : ${fM3(lastIdx)} m³` : "⚠️ Premier relevé (pas d'index précédent)"}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

          {type==="assurance" && <>
            {copro.assuranceAnnuelle&&Number(copro.assuranceAnnuelle)>0
              ? <div style={{background:"#0f0f2a",borderRadius:10,padding:"12px",border:"1px solid #818cf844",marginBottom:14}}>
                  <div style={{fontFamily:"system-ui",fontSize:12,color:"#818cf8",fontWeight:700,marginBottom:8}}>Parts égales — {fEUR(Number(copro.assuranceAnnuelle))} total</div>
                  {members.map((m,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",fontFamily:"system-ui",fontSize:13,color:"#94a3b8",marginBottom:4}}>
                      <span>{m.name}</span><span style={{color:"#4ade80",fontWeight:700}}>{fEUR(splitEqual(Number(copro.assuranceAnnuelle),members.length)[i])}</span>
                    </div>
                  ))}
                </div>
              : <Err>Renseignez d'abord la cotisation annuelle dans ⚙️ Paramètres.</Err>
            }
          </>}

          {type==="autre" && members.map((m,i)=>(
            <FL key={i} label={m.name}><NIn value={mAmts[m.id]||""} onChange={v=>setMAmts(p=>({...p,[m.id]:v}))} placeholder="0.00" unit="€"/></FL>
          ))}

          <FL label="Note (optionnel)"><FI value={note} onChange={setNote} placeholder="Référence facture…"/></FL>
          <Btn disabled={!canCreate||members.length===0} onClick={create} full>Créer l'appel de fonds</Btn>
        </div>
      )}

      {sorted.length===0&&!show&&<Empty>Aucun appel de fonds.</Empty>}

      {sorted.map(a=>{
        const tDu  =(a.payments||[]).reduce((s,p)=>s+Number(p.amount),0);
        const tPay =(a.payments||[]).filter(p=>p.paid).reduce((s,p)=>s+Number(p.amount),0);
        const allIn=(a.releves?.length||0)>=members.length&&members.length>0;
        const bc   =a.status==="complete"?"#4ade80":a.status==="open"?"#f59e0b":"#3b82f6";
        return (
          <div key={a.id} style={{...S.card,marginBottom:14,borderLeft:`4px solid ${bc}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div>
                <div style={{fontFamily:"system-ui",fontSize:14,fontWeight:700,color:"#f0f9ff"}}>
                  {a.type==="eau"?"💧":a.type==="assurance"?"🛡️":"📁"} {a.title}
                </div>
                <div style={{fontFamily:"system-ui",fontSize:11,color:"#64748b",marginTop:2,display:"flex",gap:10,flexWrap:"wrap"}}>
                  <span>{fDATE(a.date)}</span>
                  {a.invoiceM3!=null&&<span style={{color:"#38bdf8"}}>{a.invoiceM3.toFixed(3)} m³</span>}
                  {a.priceM3!=null&&<span style={{color:"#a78bfa"}}>{a.priceM3.toFixed(5)} €/m³</span>}
                  {a.note&&<span>· {a.note}</span>}
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:700,color:a.status==="complete"?"#4ade80":"#60a5fa"}}>
                  {a.status==="open"?"⏳ Relevés en cours":`${fEUR(tPay)} / ${fEUR(tDu)}`}
                </div>
                <SBadge status={a.status}/>
              </div>
            </div>

            {a.type==="eau"&&a.status==="open"&&(
              <div style={{background:"#060c16",borderRadius:10,padding:"12px",marginBottom:10,border:"1px solid #f59e0b33"}}>
                <div style={{fontFamily:"system-ui",fontSize:12,fontWeight:700,color:"#f59e0b",marginBottom:8}}>Relevés reçus</div>
                {members.map((m,i)=>{
                  const r=(a.releves||[]).find(rv=>rv.ownerId===m.id);
                  return <div key={i} style={{display:"flex",justifyContent:"space-between",fontFamily:"system-ui",fontSize:13,color:"#94a3b8",marginBottom:4}}>
                    <span>{m.name}</span>
                    {r?<span style={{color:"#4ade80"}}>✓ {fM3(r.m3)} m³</span>:<span style={{color:"#f59e0b"}}>En attente…</span>}
                  </div>;
                })}
                {allIn&&<button onClick={()=>validateReleves(a.id)} style={{width:"100%",marginTop:10,padding:"9px",borderRadius:9,border:"none",background:"linear-gradient(135deg,#059669,#10b981)",color:"#fff",fontFamily:"system-ui",fontSize:13,fontWeight:700,cursor:"pointer"}}>✓ Valider et calculer les parts</button>}
              </div>
            )}

            {a.status!=="open"&&tDu>0&&(
              <div style={{height:5,background:"#1a3a5f",borderRadius:3,marginBottom:12,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${(tPay/tDu)*100}%`,background:"linear-gradient(90deg,#3b82f6,#4ade80)",borderRadius:3,transition:"width 0.4s"}}/>
              </div>
            )}

            {a.status!=="open"&&(a.payments||[]).map((p,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px",borderRadius:9,background:p.paid?"#14532d22":"#1a3a5f22",marginBottom:6,border:`1px solid ${p.paid?"#166834":"#1a3a5f"}`}}>
                <div style={{display:"flex",gap:10,alignItems:"center"}}>
                  <button onClick={()=>togglePaid(a.id,p.owner)} style={{width:26,height:26,borderRadius:7,border:`2px solid ${p.paid?"#4ade80":"#3b82f6"}`,background:p.paid?"#4ade80":"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"#0a1628",flexShrink:0}}>{p.paid?"✓":""}</button>
                  <div>
                    <div style={{fontFamily:"system-ui",fontSize:13,color:p.paid?"#86efac":"#e2e8f0",fontWeight:600}}>{p.ownerName}</div>
                    {a.type==="eau"&&p.m3>0&&<div style={{fontFamily:"system-ui",fontSize:11,color:"#38bdf8"}}>{fM3(p.m3)} m³ {a.priceM3&&<span style={{color:"#a78bfa"}}>· {fM3(p.m3)} × {a.priceM3.toFixed(5)} €</span>}</div>}
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"system-ui",fontSize:15,fontWeight:700,color:p.paid?"#4ade80":"#f59e0b"}}>{fEUR(p.amount)}</div>
                  {p.paid&&p.paidDate&&<div style={{fontFamily:"system-ui",fontSize:10,color:"#64748b"}}>{fDATE(p.paidDate)}</div>}
                </div>
              </div>
            ))}
            <div style={{textAlign:"right",marginTop:8}}>
              <button onClick={()=>delAppel(a.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:12,fontFamily:"system-ui"}}>🗑 Supprimer</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── Relevé (membre) ──────────────────────────────────
function ReleveTab({ copro, user, update }) {
  const openEau=(copro.appels||[]).filter(a=>a.type==="eau"&&a.status==="open");
  const [vals,setVals]=useState({});
  const members=(copro.users||[]).filter(u=>u.active&&u.id!=="__admin__");

  async function submit(appelId,m3val) {
    if (!m3val||Number(m3val)<=0) return;
    const appels=(copro.appels||[]).map(a=>{
      if (a.id!==appelId) return a;
      const releves=[...(a.releves||[]).filter(r=>r.ownerId!==user.id),{ownerId:user.id,ownerName:user.name,m3:Number(m3val),enteredAt:new Date().toISOString()}];
      return {...a,releves};
    });
    await update({appels});
    setVals(p=>({...p,[appelId]:""}));
  }

  if (!openEau.length) return (
    <div><h2 style={S.h2}>Mon relevé d'eau</h2>
    <Empty>Aucun relevé à saisir.<br/>Le syndic vous contactera à la prochaine facture.</Empty></div>
  );

  return (
    <div>
      <h2 style={S.h2}>Mon relevé d'eau</h2>
      {openEau.map(a=>{
        const r=(a.releves||[]).find(rv=>rv.ownerId===user.id);
        const total=(a.releves||[]).reduce((s,rv)=>s+rv.m3,0);
        return (
          <div key={a.id} style={{...S.card,border:`1px solid ${r?"#166834":"#2563eb44"}`}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
              <div>
                <div style={{fontFamily:"system-ui",fontSize:16,fontWeight:700,color:"#f0f9ff"}}>💧 {a.title}</div>
                <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b"}}>{fDATE(a.date)}</div>
                {a.totalBill&&<div style={{fontFamily:"system-ui",fontSize:13,color:"#f59e0b",fontWeight:600,marginTop:4}}>Facture : {fEUR(a.totalBill)}</div>}
              </div>
              <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b"}}>{(a.releves||[]).length}/{members.length} reçus</div>
            </div>
            {r?(
              <div style={{background:"#14532d22",borderRadius:10,padding:"16px",border:"1px solid #166834",textAlign:"center"}}>
                <div style={{fontSize:26,marginBottom:6}}>✓</div>
                <div style={{fontFamily:"system-ui",fontSize:18,fontWeight:700,color:"#4ade80"}}>{fM3(r.m3)} m³</div>
                <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b",marginTop:4}}>Saisi le {fDATE(r.enteredAt)}</div>
                {a.totalBill&&total>0&&<div style={{fontFamily:"system-ui",fontSize:12,color:"#f59e0b",marginTop:8}}>Estimation : {fEUR((r.m3/total)*a.totalBill)}</div>}
                <button onClick={()=>update({appels:(copro.appels||[]).map(x=>x.id!==a.id?x:{...x,releves:(x.releves||[]).filter(rv=>rv.ownerId!==user.id)})})}
                  style={{marginTop:10,background:"none",border:"1px solid #1a3a5f",color:"#64748b",padding:"5px 14px",borderRadius:8,cursor:"pointer",fontFamily:"system-ui",fontSize:12}}>Modifier</button>
              </div>
            ):(
              <FL label="Votre consommation (m³)">
                <div style={{display:"flex",gap:10}}>
                  <NIn value={vals[a.id]||""} onChange={v=>setVals(p=>({...p,[a.id]:v}))} placeholder="0.000" unit="m³"/>
                  <Btn small disabled={!vals[a.id]||Number(vals[a.id])<=0} onClick={()=>submit(a.id,vals[a.id])}>Enregistrer</Btn>
                </div>
              </FL>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── Caisse ───────────────────────────────────────────
function CaisseTab({ copro, balance, update }) {
  const tIN =(copro.appels||[]).flatMap(a=>(a.payments||[]).filter(p=>p.paid)).reduce((s,p)=>s+Number(p.amount),0);
  const tOUT=(copro.depenses||[]).reduce((s,d)=>s+Number(d.amount),0);
  const pending=(copro.appels||[]).flatMap(a=>a.status!=="open"?(a.payments||[]).filter(p=>!p.paid).map(p=>({...p,appelTitle:a.title,appelId:a.id})):[]);
  const events=[
    ...(copro.appels||[]).flatMap(a=>(a.payments||[]).filter(p=>p.paid).map(p=>({date:p.paidDate,type:"in",label:`${p.ownerName} — ${a.title}`,amount:p.amount}))),
    ...(copro.depenses||[]).map(d=>({date:d.date,type:"out",label:d.label,amount:d.amount})),
  ].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,15);

  async function confirm_(appelId,ownerId) {
    const appels=(copro.appels||[]).map(a=>{
      if (a.id!==appelId) return a;
      const payments=(a.payments||[]).map(p=>p.owner!==ownerId?p:{...p,paid:true,paidDate:new Date().toISOString()});
      return {...a,payments,status:payments.every(p=>p.paid)?"complete":"active"};
    });
    await update({appels});
  }

  return (
    <div>
      <h2 style={S.h2}>Caisse commune</h2>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:22}}>
        <KPI icon="📥" label="Entrées" val={fEUR(tIN)}  color="#4ade80"/>
        <KPI icon="📤" label="Sorties" val={fEUR(tOUT)} color="#f87171"/>
        <KPI icon="💰" label="Solde"   val={fEUR(balance)} color={balance>=0?"#4ade80":"#f87171"}/>
      </div>

      {pending.length>0&&(
        <Sec title={`⏳ Virements à confirmer (${pending.length})`}>
          {pending.map((p,i)=>(
            <div key={i} style={{...S.card,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,border:"1px solid #f59e0b33"}}>
              <div>
                <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:600,color:"#fde68a"}}>{p.ownerName}</div>
                <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b"}}>{p.appelTitle}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontFamily:"system-ui",fontWeight:700,color:"#f59e0b"}}>{fEUR(p.amount)}</span>
                <button onClick={()=>confirm_(p.appelId,p.owner)} style={{padding:"6px 14px",borderRadius:9,border:"none",background:"linear-gradient(135deg,#059669,#10b981)",color:"#fff",fontFamily:"system-ui",fontSize:13,fontWeight:700,cursor:"pointer"}}>✓ Reçu</button>
              </div>
            </div>
          ))}
        </Sec>
      )}

      <Sec title="📜 Historique">
        {!events.length?<Empty>Aucun mouvement.</Empty>:events.map((e,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",background:S.card.background,borderRadius:10,marginBottom:6,borderLeft:`3px solid ${e.type==="in"?"#4ade80":"#f87171"}`}}>

// ─── Compteurs (syndic) ───────────────────────────────────
function CompteursTab({ copro, update }) {
  const members = (copro.users||[]).filter(u=>u.active && u.id!=="__admin__");
  const [indexes, setIndexes] = useState(
    Object.fromEntries(members.map(m=>[m.id, m.lastIndex||""]))
  );
  const [adminCode, setAdminCode] = useState("");
  const [verified, setVerified] = useState(false);
  const [err, setErr] = useState("");
  const [saved, setSaved] = useState(false);

  // Le code admin = mot de passe du syndic ou "admin"
  function verifyCode() {
    // On accepte le mot de passe admin de la copro (stocké en hash)
    // Pour simplifier on utilise un code à 4 chiffres que le syndic fixe
    if (adminCode.length >= 4) {
      setVerified(true);
      setErr("");
    } else {
      setErr("Code trop court (min. 4 caractères)");
    }
  }

  async function saveIndexes() {
    const users = (copro.users||[]).map(u => {
      const newIdx = indexes[u.id];
      if (newIdx !== undefined && newIdx !== "") {
        return { ...u, lastIndex: Number(newIdx), indexHistory: [
          ...(u.indexHistory||[]),
          { index: Number(newIdx), date: new Date().toISOString(), setBy: "syndic" }
        ]};
      }
      return u;
    });
    await update({ users });
    setSaved(true);
    setTimeout(()=>setSaved(false), 2500);
  }

  return (
    <div>
      <h2 style={S.h2}>🔢 Index des compteurs</h2>
      <div style={{fontFamily:"system-ui",fontSize:13,color:"#64748b",marginBottom:20,lineHeight:1.7}}>
        Définissez ou mettez à jour l'index de départ de chaque propriétaire.<br/>
        Cet index sert de base pour calculer la consommation lors du prochain relevé.
      </div>

      {/* Vérification code admin */}
      {!verified ? (
        <div style={{...S.card,border:"1px solid #f59e0b44",maxWidth:420}}>
          <div style={{fontFamily:"system-ui",fontSize:14,fontWeight:700,color:"#f59e0b",marginBottom:6}}>
            🔒 Accès protégé
          </div>
          <div style={{fontFamily:"system-ui",fontSize:12,color:"#64748b",marginBottom:16,lineHeight:1.6}}>
            La modification des index compteurs est protégée pour éviter toute fraude.<br/>
            Entrez votre mot de passe syndic pour continuer.
          </div>
          <FL label="Votre mot de passe syndic">
            <FI type="password" value={adminCode} onChange={setAdminCode}
              placeholder="Votre mot de passe"
              onKey={e=>e.key==="Enter"&&verifyCode()}/>
          </FL>
          {err && <Err>{err}</Err>}
          <Btn onClick={verifyCode} full>🔓 Accéder aux compteurs</Btn>
        </div>
      ) : (
        <>
          <div style={{background:"#14532d22",borderRadius:10,padding:"10px 14px",border:"1px solid #166834",marginBottom:20,fontFamily:"system-ui",fontSize:12,color:"#4ade80",display:"flex",alignItems:"center",gap:8}}>
            ✓ Accès autorisé — vous pouvez modifier les index
          </div>

          {members.length === 0 ? (
            <Empty>Aucun membre dans cette copropriété.</Empty>
          ) : (
            <>
              <div style={{border:"1px solid #1a3a5f33",borderRadius:12,overflow:"hidden",marginBottom:16}}>
                {/* Header */}
                <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1.5fr",background:"#060c16",padding:"10px 16px",borderBottom:"1px solid #1a3a5f22"}}>
                  {["Propriétaire","Index actuel enregistré","Nouvel index (m³)"].map(h=>(
                    <div key={h} style={{fontFamily:"system-ui",fontSize:11,fontWeight:700,color:"#334155",letterSpacing:1,textTransform:"uppercase"}}>{h}</div>
                  ))}
                </div>

                {members.map((m,i)=>(
                  <div key={m.id} style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1.5fr",padding:"14px 16px",borderBottom:i<members.length-1?"1px solid #1a3a5f11":"none",background:i%2===0?"#0c1829":"#090f1d",alignItems:"center",gap:10}}>
                    {/* Nom */}
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <Av name={m.name} idx={i} size={34}/>
                      <div>
                        <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:600,color:"#e2e8f0"}}>{m.name}</div>
                        <div style={{fontFamily:"system-ui",fontSize:11,color:"#475569"}}>{m.type==="proprietaire"?"🏠":"🔑"} {m.type}</div>

                    {/* Index actuel */}
                    <div style={{textAlign:"center"}}>

                      <span style={{color:"#e2e8f0",fontWeight:600}}>{m.name}</span>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
