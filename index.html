                          <span style={{color:"#64748b"}}>{Number(m.lastIndex).toFixed(3)} m³</span>
                          <span style={{color:"#475569"}}>→</span>
                        </>}
                        <span style={{color:"#4ade80",fontWeight:700}}>{Number(indexes[m.id]).toFixed(3)} m³</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              <Btn onClick={saveIndexes} full style={{background:"linear-gradient(135deg,#059669,#10b981)"}}>
                {saved ? "✅ Index enregistrés !" : "💾 Enregistrer les index"}
              </Btn>
            </>
          )}
        </>
      )}
    </div>
  );
}

// ─── Paramètres copro ─────────────────────────────────
// ─── Gestionnaire d'index (admin) ────────────────────────
function IndexManager({ copro, adminPin, onUpdate }) {
  const [pinInput, setPinInput] = useState("");
  const [unlocked, setUnlocked] = useState(false);
  const [indexes, setIndexes] = useState(() => {
    const obj = {};
    (copro.users||[]).forEach(u => { obj[u.id] = u.lastIndex || ""; });
    return obj;
  });
  const [saved, setSaved] = useState(false);

  function unlock() {
    if (!adminPin) { setUnlocked(true); return; } // no PIN set yet
    if (pinInput === adminPin) { setUnlocked(true); setPinInput(""); }
    else { alert("Code PIN incorrect."); setPinInput(""); }
  }

  async function saveIndexes() {
    const users = (copro.users||[]).map(u => ({
      ...u,
      lastIndex: indexes[u.id] ? Number(indexes[u.id]) : u.lastIndex
    }));
    await onUpdate({ users });
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  const members = (copro.users||[]).filter(u => u.role !== "admin");

  if (!unlocked) return (
    <div>
      {members.map((u,i) => (
        <div key={i} style={{display:"flex",justifyContent:"space-between",fontFamily:"system-ui",fontSize:13,color:"#64748b",marginBottom:8,padding:"8px 0",borderBottom:"1px solid #1a3a5f22"}}>
          <span style={{color:"#e2e8f0"}}>{u.name}</span>
          <span style={{color:"#38bdf8"}}>{u.lastIndex ? fM3(u.lastIndex)+" m³" : <span style={{color:"#f59e0b"}}>Non défini</span>}</span>
        </div>
      ))}
      {adminPin ? (
        <div style={{display:"flex",gap:10,marginTop:12}}>
          <div style={{position:"relative",flex:1}}>
            <input type="password" value={pinInput} onChange={e=>setPinInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&unlock()}
              placeholder="Code PIN admin pour modifier"
              style={{...S.inp,paddingRight:36}}/>
          </div>
          <button onClick={unlock} style={{padding:"0 16px",borderRadius:9,border:"none",background:"#1d4ed8",color:"#fff",fontFamily:"system-ui",fontSize:13,fontWeight:700,cursor:"pointer"}}>
            🔓 Déverrouiller
          </button>
        </div>
      ) : (
        <div style={{fontFamily:"system-ui",fontSize:11,color:"#f59e0b",marginTop:8}}>
          ⚠️ Définissez un code PIN admin ci-dessus pour protéger les index.
        </div>
      )}
    </div>
  );

  return (
    <div>
      <div style={{fontFamily:"system-ui",fontSize:12,color:"#4ade80",marginBottom:14}}>🔓 Mode modification activé</div>
      {members.map((u,i) => (
        <div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <span style={{fontFamily:"system-ui",fontSize:13,fontWeight:600,color:"#e2e8f0",width:120,flexShrink:0}}>{u.name}</span>
          <div style={{position:"relative",flex:1}}>
            <input type="number" min="0" step="0.001"
              value={indexes[u.id]||""}
              onChange={e=>setIndexes(p=>({...p,[u.id]:e.target.value}))}
              placeholder="Index en m³" style={{...S.inp,paddingRight:42}}/>
            <span style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",color:"#38bdf8",fontFamily:"system-ui",fontSize:12,fontWeight:700}}>m³</span>
          </div>
        </div>
      ))}
      <div style={{display:"flex",gap:10,marginTop:4}}>
        <button onClick={()=>setUnlocked(false)} style={{padding:"8px 16px",borderRadius:9,border:"1px solid #1a3a5f",background:"transparent",color:"#64748b",fontFamily:"system-ui",fontSize:13,cursor:"pointer"}}>
          🔒 Verrouiller
        </button>
        <button onClick={saveIndexes} style={{flex:1,padding:"10px",borderRadius:9,border:"none",background:"linear-gradient(135deg,#059669,#10b981)",color:"#fff",fontFamily:"system-ui",fontSize:13,fontWeight:700,cursor:"pointer"}}>
          {saved ? "✓ Index sauvegardés !" : "Enregistrer les index"}
        </button>
      </div>
    </div>
  );
}

function ParamsTab({ copro, update }) {
  const [form,setForm]=useState({iban:copro.iban||"",refPriceM3:copro.refPriceM3||"",assuranceAnnuelle:copro.assuranceAnnuelle||"",adminPin:""});
  const [ok,setOk]=useState(false);
  const [fetchSt,setFetchSt]=useState("idle");
  const [fetchR,setFetchR]=useState(null);

  async function autoFetch() {
    setFetchSt("loading"); setFetchR(null);
    try {
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",max_tokens:512,
          tools:[{type:"web_search_20250305",name:"web_search"}],
          system:`Prix m³ eau TTC Marseille SEM 2025. JSON uniquement: {"prix_m3":<float>,"source":"<string>","annee":<int>}`,
          messages:[{role:"user",content:"Prix m³ eau potable TTC Marseille 2025 Eaux de Marseille. JSON."}]
        })
      });
      const data=await res.json();
      const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
      const m=text.match(/\{[^{}]+\}/);
      if (m) {
        const r=JSON.parse(m[0]);
        if (r.prix_m3) { setForm(p=>({...p,refPriceM3:String(r.prix_m3)})); setFetchR(r); setFetchSt("ok"); }
        else { setFetchSt("error"); }
      } else setFetchSt("error");
    } catch { setFetchSt("error"); }
  }

  async function saveParams() {
    await update({iban:form.iban,refPriceM3:form.refPriceM3,assuranceAnnuelle:form.assuranceAnnuelle,adminPin:form.adminPin||copro.adminPin||""});

  return (
    <div style={{maxWidth:520}}>

        <textarea value={form.iban} onChange={e=>setForm(p=>({...p,iban:e.target.value}))}
          placeholder={"FR76 XXXX XXXX XXXX XXXX XXXX XXX\nTitulaire : …"} style={{...S.inp,height:68,resize:"vertical"}}/>
      </div>

      <div style={S.card}>
        <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:700,color:"#f59e0b",marginBottom:6}}>🔐 Code admin — Protection des index</div>
        <div style={{fontFamily:"system-ui",fontSize:12,color:"#475569",marginBottom:12,lineHeight:1.6}}>
          Ce code est requis pour modifier l'index précédent d'un propriétaire.<br/>
          <span style={{color:"#f59e0b"}}>Les propriétaires ne peuvent PAS modifier leur propre index précédent.</span>
        </div>
        <div style={{position:"relative"}}>
          <input type="password" value={form.adminPin||""} onChange={e=>setForm(p=>({...p,adminPin:e.target.value}))}
            placeholder="Code PIN admin (min. 4 chiffres)" style={{...S.inp,paddingRight:36}}/>
        </div>
        {form.adminPin&&form.adminPin.length>=4&&<div style={{fontFamily:"system-ui",fontSize:11,color:"#4ade80",marginTop:6}}>✓ Code PIN défini</div>}
      </div>

      <div style={S.card}>
        <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:700,color:"#38bdf8",marginBottom:10}}>📊 Index initiaux des propriétaires</div>
        <div style={{fontFamily:"system-ui",fontSize:12,color:"#475569",marginBottom:14,lineHeight:1.6}}>

      <div style={S.card}>
        <div style={{fontFamily:"system-ui",fontSize:13,fontWeight:700,color:"#38bdf8",marginBottom:6}}>💧 Tarif Eaux de Marseille</div>
        <div style={{fontFamily:"system-ui",fontSize:12,color:"#475569",marginBottom:12,lineHeight:1.6}}>
          Prix m³ TTC → les m³ se calculent <strong style={{color:"#4ade80"}}>automatiquement</strong> dès que vous saisissez le montant TTC.
        </div>
        <div style={{display:"flex",gap:10,marginBottom:10}}>
          <NIn value={form.refPriceM3} onChange={v=>setForm(p=>({...p,refPriceM3:v}))} placeholder="ex: 3.78500" unit="€/m³"/>
          <button onClick={autoFetch} disabled={fetchSt==="loading"} style={{padding:"0 14px",borderRadius:10,border:"1px solid #1a3a5f",background:S.card.background,color:"#60a5fa",fontFamily:"system-ui",fontSize:13,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>

        {fetchSt==="ok"&&fetchR&&<div style={{fontFamily:"system-ui",fontSize:12,color:"#4ade80",marginBottom:8}}>✓ {fetchR.prix_m3} €/m³ ({fetchR.annee})</div>}

// ─── DataStatusBar ────────────────────────────────────
function DataStatusBar({ lastSaved, db, onExport }) {
  const [age, setAge] = useState(0);
  const [lsOk, setLsOk] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(LS_PRIMARY);
      if (raw) { const d=JSON.parse(raw); setLsOk(d?.superAdmin!=null); }
    } catch {}
  }, [lastSaved]);

  useEffect(() => {
    if (!lastSaved) return;
    const t = setInterval(() => setAge(Math.round((Date.now()-lastSaved)/1000)), 3000);
    return () => clearInterval(t);
  }, [lastSaved]);

  const nb_copros = db?.copros?.length || 0;
  const nb_users  = db?.copros?.reduce((s,c)=>s+(c.users||[]).length,0) || 0;
  const nb_appels = db?.copros?.reduce((s,c)=>s+(c.appels||[]).length,0) || 0;

  return (
    <div style={{background:"#060c16",borderBottom:"1px solid #1a3a5f22",padding:"6px 22px",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      {/* Statut local */}
      <div style={{display:"flex",alignItems:"center",gap:6,fontFamily:"system-ui",fontSize:11}}>
        <span style={{width:7,height:7,borderRadius:"50%",background:lsOk?"#4ade80":"#f87171",display:"inline-block"}}/>
        <span style={{color:lsOk?"#4ade80":"#f87171",fontWeight:700}}>
          {lsOk?"Local sécurisé":"⚠️ Vérification…"}
        </span>
        {lastSaved&&<span style={{color:"#334155"}}>· {age<5?"à l'instant":age<60?`il y a ${age}s`:`il y a ${Math.round(age/60)}min`}</span>}
      </div>

      {/* Statut Firebase */}
      <div style={{display:"flex",alignItems:"center",gap:6,fontFamily:"system-ui",fontSize:11}}>
        <span style={{width:7,height:7,borderRadius:"50%",background:"#60a5fa",display:"inline-block",animation:"pulse 2s infinite"}}/>
        <span style={{color:"#60a5fa",fontWeight:700}}>☁️ Sync Firebase active</span>
        <style>{`@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}`}</style>
      </div>

      {/* Résumé */}
      <div style={{display:"flex",gap:12,fontFamily:"system-ui",fontSize:11,color:"#334155"}}>
        <span>🏢 {nb_copros} copro{nb_copros!==1?"s":""}</span>
        <span>👥 {nb_users} user{nb_users!==1?"s":""}</span>
        <span>📢 {nb_appels} appel{nb_appels!==1?"s":""}</span>
      </div>

      <button onClick={onExport} style={{marginLeft:"auto",background:"none",border:"1px solid #1a3a5f",color:"#475569",padding:"3px 10px",borderRadius:6,cursor:"pointer",fontFamily:"system-ui",fontSize:11}}>
        ↓ Copie locale (.json)
      </button>
    </div>
  );
}

// ─── SaveBadge ────────────────────────────────────────
function SaveBadge({ lastSaved }) {
  const [label, setLabel] = useState("✅ Sauvegardé");
  useEffect(() => {
    if (!lastSaved) return;
    function update() {
      const diff = Math.round((Date.now() - lastSaved) / 1000);
      if (diff < 5)        setLabel("✅ Sauvegardé à l'instant");
      else if (diff < 60)  setLabel(`✅ Sauvegardé il y a ${diff}s`);
      else if (diff < 120) setLabel("✅ Sauvegardé il y a 1 min");
      else                 setLabel(`✅ Sauvegardé il y a ${Math.round(diff/60)} min`);
    }
    update();
    const t = setInterval(update, 5000);
    return () => clearInterval(t);
  }, [lastSaved]);
  if (!lastSaved) return null;
  return (
    <span style={{fontFamily:"system-ui",fontSize:11,color:"#4ade80",background:"#14532d33",padding:"4px 10px",borderRadius:20,whiteSpace:"nowrap"}}>
      {label}
    </span>
  );
}
